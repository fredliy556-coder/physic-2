 + 6 = 0.", "t = 2 или t = 3", "По теореме Виета."]]}, {"ch": "kin", "sub": "Равномерное прямолинейное движение", "items": [["Автомобиль едет со скоростью 90 км/ч. Какой путь он пройдёт за 2 часа?", "180 км", "s = vt."], ["Пешеход идёт со скоростью 1,5 м/с. Какой путь он пройдёт за 10 минут?", "900 м", ""], ["Поезд длиной 200 м едет по мосту длиной 400 м со скоростью 72 км/ч. За какое время он полностью проедет мост (от входа локомотива до выхода последнего вагона)?", "30 с", "Путь = длина моста + длина поезда."], ["Закон движения x = 5 + 3t (м). Найдите начальную координату, скорость и координату через 4 с.", "x₀ = 5 м, v = 3 м/с, x(4) = 17 м", ""], ["Закон движения x = 20 − 4t (м). Когда тело окажется в начале координат? Чему равна проекция скорости?", "через 5 с; v_x = −4 м/с", ""], ["Гром был услышан через 6 с после вспышки молнии. Скорость звука 340 м/с. Как далеко ударила молния?", "2040 м", "Свет считаем мгновенным."], ["Звук от выстрела вернулся эхом через 4 с. На каком расстоянии преграда? (v = 340 м/с)", "680 м", "Звук проходит путь туда и обратно."], ["Катер идёт со скоростью 36 км/ч. За какое время он пройдёт 3 км?", "300 с", "36 км/ч = 10 м/с."], ["Тело за 5 с проходит 30 м. За какое время оно пройдёт 150 м с той же скоростью?", "25 с", "v = 6 м/с."], ["Скорость света 3·10⁸ м/с, расстояние до Луны 384 000 км. За какое время свет доходит от Луны до Земли?", "1,28 с", ""]]}, {"ch": "kin", "sub": "Средняя скорость", "items": [["Автомобиль ехал 2 ч со скоростью 60 км/ч и 3 ч со скоростью 80 км/ч. Найдите среднюю скорость.", "72 км/ч", "Весь путь делим на всё время."], ["Первую половину пути автомобиль ехал со скоростью 40 км/ч, вторую — 60 км/ч. Найдите среднюю скорость.", "48 км/ч", "v = 2v₁v₂/(v₁+v₂)."], ["Первую половину времени автомобиль ехал со скоростью 40 км/ч, вторую — 60 км/ч. Найдите среднюю скорость.", "50 км/ч", "Среднее арифметическое верно только для равных времён."], ["Бегун пробежал 100 м за 12 с, затем 200 м за 18 с. Найдите среднюю скорость на всём пути.", "10 м/с", ""], ["Туристы поднимались в гору со скоростью 12 км/ч, а спускались по тому же пути со скоростью 36 км/ч. Найдите среднюю скорость.", "18 км/ч", ""], ["За 2,5 ч автомобиль проехал 120 км. Найдите среднюю скорость в км/ч и м/с.", "48 км/ч ≈ 13,33 м/с", ""], ["Первые 20 км велосипедист ехал со скоростью 20 км/ч, следующие 30 км проехал за 1 ч. Найдите среднюю скорость.", "25 км/ч", "Время: 1 ч + 1 ч."], ["Путь туда автомобиль проехал со скоростью 60 км/ч. С какой скоростью он должен ехать обратно, чтобы средняя скорость за всю поездку была 48 км/ч?", "40 км/ч", "2·60·v/(60+v) = 48."], ["Три равных участка пути пройдены со скоростями 10, 20 и 60 км/ч. Найдите среднюю скорость.", "18 км/ч", "v = 3 / (1/v₁ + 1/v₂ + 1/v₃)."], ["Треть пути велосипедист ехал со скоростью 12 км/ч, а остальной путь с постоянной скоростью v. Средняя скорость 18 км/ч. Найдите v.", "24 км/ч", "1/18 = (1/3)/12 + (2/3)/v."]]}, {"ch": "kin", "sub": "Встреча и погоня", "items": [["Между городами 120 км. Из них одновременно навстречу выехали автомобили со скоростями 40 и 60 км/ч. Через какое время и на каком расстоянии от первого города они встретятся?", "через 1,2 ч, в 48 км от первого города", "t = L/(v₁+v₂)."], ["Догоняющий едет со скоростью 20 м/с, убегающий — 15 м/с, расстояние между ними 100 м. Через сколько секунд первый догонит второго?", "20 с", "t = L/(v₁−v₂)."], ["Пешеход идёт со скоростью 5 км/ч. Через 1 ч вслед за ним выехал велосипедист со скоростью 15 км/ч. Через какое время после выезда он догонит пешехода и на каком расстоянии от старта?", "через 0,5 ч, на расстоянии 7,5 км", ""], ["Два поезда длиной по 150 м идут навстречу по параллельным путям со скоростями 54 и 72 км/ч. За какое время они разойдутся (от встречи локомотивов до выхода последних вагонов)?", "8,57 с", "Скорости 15 и 20 м/с. Путь 300 м."], ["Легковой автомобиль длиной 4 м едет со скоростью 72 км/ч и обгоняет грузовик длиной 16 м, едущий со скоростью 54 км/ч. За какое время произойдёт обгон (от момента, когда автомобиль вплотную к заднему концу грузовика, до момента, когда он вплотную к переднему)?", "4 с", "Относительная скорость 5 м/с, путь 16 + 4 = 20 м."], ["Законы движения тел: x₁ = 10 + 2t, x₂ = 50 − 3t. Найдите время и место встречи.", "t = 8 с, x = 26 м", "Приравняем x₁ = x₂."], ["x₁ = −20 + 5t, второе тело стоит в точке x₂ = 10 м. Через сколько секунд первое тело достигнет второго?", "6 с", ""], ["Из пунктов A и B, расстояние между которыми 150 км, навстречу друг другу одновременно выехали два автомобиля. Они встретились через 2 ч. Скорость первого 45 км/ч. Найдите скорость второго.", "30 км/ч", ""], ["Мотоциклист догоняет велосипедиста, находящегося впереди на 400 м. Скорость мотоциклиста 25 м/с, велосипедиста 10 м/с. Через какое время он его догонит?", "26,67 с", "t = 400/15."], ["Из двух пунктов, расстояние между которыми 60 км, одновременно навстречу выехали два велосипедиста и встретились через 1,5 ч. Один едет в 1,5 раза быстрее другого. Найдите их скорости.", "16 км/ч и 24 км/ч", "v₁+v₂ = 60/1,5 = 40 км/ч."]]}, {"ch": "kin", "sub": "Равноускоренное движение", "items": [["Тело начинает двигаться из состояния покоя с ускорением 2 м/с². Найдите скорость и путь через 5 с.", "v = 10 м/с, s = 25 м", ""], ["Начальная скорость 5 м/с, ускорение 3 м/с². Найдите скорость и путь за 4 с.", "v = 17 м/с, s = 44 м", ""], ["Автомобиль разгоняется от 0 до 72 км/ч за 10 с. Найдите ускорение и пройденный путь.", "a = 2 м/с², s = 100 м", "72 км/ч = 20 м/с."], ["На пути 200 м скорость тела выросла от 10 до 30 м/с. Найдите ускорение.", "2 м/с²", "v² − v₀² = 2as."], ["С каким ускорением должен двигаться автомобиль из покоя, чтобы за 40 с набрать 20 м/с? Какой путь он пройдёт?", "a = 0,5 м/с², s = 400 м", ""], ["Закон движения x = 2 + 3t + 4t² (м). Найдите v₀, a и скорость через 2 с.", "v₀ = 3 м/с, a = 8 м/с², v(2) = 19 м/с", "Сравните с x = x₀ + v₀t + at²/2."], ["Из состояния покоя тело за 4 с прошло 32 м. Найдите ускорение и конечную скорость.", "a = 4 м/с², v = 16 м/с", ""], ["Начальная скорость тела 2 м/с, ускорение 1 м/с². Какой путь оно пройдёт за третью секунду?", "4,5 м", "s_n = v₀ + a(2n−1)/2."], ["На пути 100 м скорость автомобиля возросла с 10 до 20 м/с. Найдите ускорение и время разгона.", "a = 1,5 м/с², t ≈ 6,67 с", ""], ["Тело из покоя за третью секунду прошло 10 м. Найдите ускорение и путь за 5 с.", "a = 4 м/с², s = 50 м", ""]]}, {"ch": "kin", "sub": "Торможение и путь за секунду", "items": [["Автомобиль едет со скоростью 72 км/ч и тормозит с ускорением 4 м/с². Найдите время торможения и тормозной путь.", "t = 5 с, s = 50 м", ""], ["Поезд движется со скоростью 54 км/ч. Тормозной путь 150 м. Найдите ускорение и время торможения.", "a = 0,75 м/с², t = 20 с", ""], ["За 5 с скорость тела уменьшилась с 20 до 10 м/с. Найдите ускорение и путь за это время.", "a = 2 м/с², s = 75 м", ""], ["Тормозной путь автомобиля при скорости 36 км/ч равен 20 м. Каким будет тормозной путь при 72 км/ч при том же ускорении?", "80 м", "Путь пропорционален квадрату скорости."], ["Тело тормозит до остановки 6 с. За последнюю секунду оно прошло 2 м. Найдите ускорение, начальную скорость и весь путь.", "a = 4 м/с², v₀ = 24 м/с, s = 72 м", "Последняя секунда: s = a/2."], ["Мотоцикл тормозит с ускорением 5 м/с² из скорости 20 м/с. Найдите путь за первую секунду и за последнюю.", "17,5 м и 2,5 м", ""], ["Тело с начальной скоростью 10 м/с тормозит с ускорением 2 м/с². Найдите скорость и путь через 3 с.", "v = 4 м/с, s = 21 м", ""], ["За 2 с торможения скорость тела уменьшилась с 12 до 6 м/с. Через какое время тело остановится и какой путь пройдёт до остановки?", "через 4 с после начала, s = 24 м", "a = 3 м/с²."], ["Тормозной путь автомобиля 40 м, ускорение 5 м/с². Найдите начальную скорость и время торможения.", "v₀ = 20 м/с, t = 4 с", ""], ["Автомобиль с начальной скоростью 20 м/с тормозит с ускорением 4 м/с². Какой путь он пройдёт за 8 с?", "50 м", "Он остановится через 5 с, дальше не движется."]]}, {"ch": "kin", "sub": "Графики движения", "items": [["График v(t) — прямая из точки (0; 0) в точку (10 с; 20 м/с). Найдите ускорение и пройденный путь.", "a = 2 м/с², s = 100 м", "Путь равен площади под графиком."], ["График v(t) — горизонтальная прямая на уровне 5 м/с от 0 до 8 с. Какой путь пройден?", "40 м", ""], ["Скорость линейно убывает с 10 м/с (t = 0) до 0 (t = 5 с). Найдите ускорение и путь.", "a = −2 м/с², s = 25 м", ""], ["График x(t) — прямая от x = 4 м (t = 0) до x = 24 м (t = 5 с). Найдите скорость.", "4 м/с", ""], ["График x(t) — прямая от x = 30 м (t = 0) до x = 0 (t = 6 с). Найдите проекцию скорости.", "−5 м/с", "Тело движется против оси x."], ["Скорость возрастает от 0 до 10 м/с за 5 с, затем 10 с постоянна, затем падает до 0 за 5 с. Найдите весь путь и среднюю скорость.", "s = 150 м, v_ср = 7,5 м/с", ""], ["Ускорение тела постоянно, a = 2 м/с², начальная скорость 1 м/с. Найдите скорость через 6 с и постройте график v(t) (опишите).", "v = 13 м/с; график — прямая с наклоном 2 м/с² из точки (0; 1)", ""], ["Скорость v = 6 − 2t (м/с). Найдите момент остановки, перемещение и путь за 5 с.", "остановка при t = 3 с; перемещение 5 м; путь 13 м", "Путь 0..3 с равен 9 м, затем тело едет назад 4 м."], ["Закон движения x = 4t − t² (м). Найдите v₀, a, момент разворота и максимальное удаление от начала.", "v₀ = 4 м/с, a = −2 м/с², t = 2 с, x_max = 4 м", ""], ["Скорость растёт от 0 до 8 м/с за 4 с, затем линейно убывает до −4 м/с (ещё за 6 с). Найдите перемещение и путь за 10 с.", "перемещение 28 м, путь 36 м", "Площадь над осью берём со знаком +, под осью со знаком −."]]}, {"ch": "kin", "sub": "Свободное падение", "items": [["Тело падает без начальной скорости с высоты 80 м. Найдите время падения и скорость у земли (g = 10 м/с²).", "t = 4 с, v = 40 м/с", ""], ["Тело падало 3 с. С какой высоты и с какой скоростью оно упало?", "h = 45 м, v = 30 м/с", ""], ["Тело брошено вертикально вверх со скоростью 20 м/с. Найдите максимальную высоту и время подъёма.", "H = 20 м, t = 2 с", ""], ["Мяч брошен вверх со скоростью 15 м/с. Через какое время он вернётся в точку броса?", "3 с", ""], ["Камень падает с высоты 20 м. Найдите скорость при ударе о землю.", "20 м/с", ""], ["Тело брошено вниз со скоростью 5 м/с с высоты 30 м. Найдите время падения и конечную скорость.", "t = 2 с, v = 25 м/с", "30 = 5t + 5t²."], ["Найдите путь, пройденный свободно падающим телом за третью секунду.", "25 м", "s_n = g(2n−1)/2."], ["Тело брошено вверх. На высоте 15 м его скорость 10 м/с. Найдите начальную скорость.", "20 м/с", "v₀² = v² + 2gh."], ["Камень упал в колодец за 3 с (время звука не учитываем). Найдите глубину колодца.", "45 м", ""], ["Тело брошено вверх со скоростью 30 м/с. Через какое время оно окажется на высоте 40 м? Объясните два ответа.", "t₁ = 2 с (при подъёме), t₂ = 4 с (при спуске)", "40 = 30t − 5t²."]]}, {"ch": "kin", "sub": "Горизонтальный бросок", "items": [["Тело брошено горизонтально со скоростью 10 м/с с высоты 45 м. Найдите время полёта и дальность (g = 10 м/с²).", "t = 3 с, L = 30 м", ""], ["С какой высоты брошено горизонтально тело, если оно падало 2 с?", "20 м", ""], ["Тело брошено горизонтально со скоростью 20 м/с и упало на расстоянии 40 м. Найдите время и высоту броска.", "t = 2 с, H = 20 м", ""], ["Мяч брошен горизонтально со скоростью 15 м/с с высоты 20 м. Найдите скорость при ударе о землю.", "25 м/с", "v_y = √(2gH) = 20 м/с."], ["Под каким углом к горизонту направлена скорость тела в момент падения, если v₀ = 10 м/с и v_y = 10 м/с?", "45°", "tg β = v_y/v₀."], ["С обрыва высотой 80 м брошен камень горизонтально. Он упал на расстоянии 120 м от основания обрыва. Найдите начальную скорость.", "30 м/с", "t = 4 с."], ["Самолёт летит горизонтально на высоте 500 м со скоростью 200 м/с и сбрасывает груз. На каком расстоянии по горизонтали до цели его нужно сбросить?", "2000 м", "t = 10 с. Сопротивление воздуха не учитываем."], ["Через 1 с после броска горизонтально со скоростью 10 м/с найдите модуль скорости и угол с горизонтом.", "v ≈ 14,14 м/с, угол 45°", ""], ["Шарик скатывается со стола высотой 1,25 м со скоростью 2 м/с. На каком расстоянии от стола он упадёт?", "1 м", "t = 0,5 с."], ["Мяч брошен горизонтально со скоростью 12 м/с. В момент удара о землю его скорость 20 м/с. Найдите высоту броска и время полёта.", "v_y = 16 м/с, t = 1,6 с, H = 12,8 м", ""]]}, {"ch": "kin", "sub": "Бросок под углом к горизонту", "items": [["Камень брошен со скоростью 20 м/с под углом 30° к горизонту. Найдите время подъёма, максимальную высоту и дальность (g = 10 м/с²).", "t = 1 с, H = 5 м, L ≈ 34,64 м", ""], ["Мяч брошен со скоростью 20 м/с под углом 45°. Найдите дальность и наибольшую высоту.", "L = 40 м, H = 10 м", ""], ["Под каким углом нужно бросить тело, чтобы дальность была максимальной? Найдите её при v₀ = 30 м/с.", "45°, L = 90 м", ""], ["Тело брошено со скоростью 50 м/с под углом 37° (sin = 0,6; cos = 0,8). Найдите время полёта, дальность и максимальную высоту.", "t = 6 с, L = 240 м, H = 45 м", ""], ["Найдите максимальную высоту подъёма тела, брошенного со скоростью 20 м/с под углом 60° к горизонту.", "15 м", ""], ["Снаряд выпущен со скоростью 40 м/с под углом 60° к горизонту. Найдите его скорость в верхней точке траектории.", "20 м/с", "В верхней точке v_y = 0."], ["Мяч брошен со скоростью 25 м/с под углом 53° (sin = 0,8; cos = 0,6). Найдите время полёта и дальность.", "t = 4 с, L = 60 м", ""], ["Дальность полёта тела, брошенного под углом 45°, равна 90 м. Найдите начальную скорость.", "30 м/с", "L = v₀²/g при α = 45°."], ["Тело брошено со скоростью 20 м/с под углом 30° к горизонту. Найдите модуль скорости через 1 с после броска.", "17,32 м/с", "v_x = 17,3 м/с; v_y = 10 − 10 = 0 (верхняя точка)."], ["Какова должна быть начальная скорость тела, брошенного под углом 30° к горизонту, чтобы максимальная высота подъёма была 20 м? Какова дальность?", "v₀ = 40 м/с, L ≈ 138,56 м", ""]]}, {"ch": "kin", "sub": "Движение по окружности", "items": [["Колесо радиусом 0,5 м делает один оборот за 2 с. Найдите частоту, угловую и линейную скорость точки обода.", "ν = 0,5 Гц, ω = π ≈ 3,14 рад/с, v ≈ 1,57 м/с", ""], ["Частота вращения 5 Гц, радиус 0,2 м. Найдите угловую скорость, линейную скорость и центростремительное ускорение.", "ω ≈ 31,42 рад/с, v ≈ 6,28 м/с, a ≈ 197 м/с²", ""], ["Минутная стрелка часов длиной 10 см. Найдите скорость её конца.", "v ≈ 1,75·10⁻⁴ м/с", "T = 3600 с."], ["Автомобиль едет со скоростью 10 м/с по дуге радиусом 50 м. Найдите центростремительное ускорение.", "2 м/с²", ""], ["Автомобиль едет со скоростью 72 км/ч по закруглению радиусом 100 м. Найдите центростремительное ускорение.", "4 м/с²", ""], ["Диск вращается с частотой 120 об/мин. Найдите период, частоту в Гц и угловую скорость.", "T = 0,5 с, ν = 2 Гц, ω ≈ 12,57 рад/с", ""], ["Точки диска расположены на расстояниях 0,1 м и 0,3 м от оси. Сравните их угловые и линейные скорости.", "Угловые скорости равны, линейная скорость второй точки в 3 раза больше.", "v = ωR."], ["Найдите скорость точки экватора Земли при вращении вокруг оси (R = 6400 км, T = 24 ч).", "v ≈ 465 м/с", ""], ["Колесо диаметром 0,6 м прокатилось без проскальзывания 942 м. Сколько оборотов оно сделало?", "N ≈ 500", "N = s/(πd)."], ["Центростремительное ускорение тела на окружности 25 м/с², скорость 10 м/с. Найдите радиус и угловую скорость.", "R = 4 м, ω = 2,5 рад/с", ""]]}, {"ch": "kin", "sub": "Относительность движения", "items": [["Скорость лодки в стоячей воде 5 м/с, скорость течения 2 м/с. Найдите скорость лодки относительно берега по течению и против течения.", "7 м/с и 3 м/с", ""], ["Лодка пересекает реку шириной 100 м, направляя нос перпендикулярно берегам. Скорость лодки 4 м/с, течения 3 м/с. Найдите время, снос и скорость относительно берега.", "t = 25 с, снос 75 м, v = 5 м/с", ""], ["Поезд едет со скоростью 20 м/с. Пассажир идёт по вагону со скоростью 1,5 м/с по ходу поезда, затем против хода. Найдите скорости относительно земли.", "21,5 м/с и 18,5 м/с", ""], ["Два автомобиля едут навстречу друг другу со скоростями 60 и 40 км/ч. Найдите скорость одного относительно другого.", "100 км/ч", ""], ["Эскалатор поднимает стоящего человека за 60 с. Человек, идущий по неподвижному эскалатору, поднимается за 90 с. За какое время он поднимется по движущемуся эскалатору?", "36 с", "Складываем скорости: 1/t = 1/60 + 1/90."], ["Как должна двигаться лодка (v = 5 м/с), чтобы пересечь реку по кратчайшему пути, если течение 3 м/с? Какова её скорость относительно берега и время переправы при ширине 100 м?", "нос против течения под углом sin α = 0,6 к нормали; v = 4 м/с, t = 25 с", ""], ["Капли дождя падают вертикально со скоростью 10 м/с. Автомобиль едет горизонтально со скоростью 20 м/с. Найдите скорость капель относительно автомобиля и угол следа на стекле с вертикалью.", "v ≈ 22,36 м/с, tg α = 2 (≈ 63,4°)", ""], ["Катер проходит по реке 12 км по течению и возвращается. Скорость катера в воде 10 км/ч, течение 2 км/ч. Сколько времени займёт путь туда и обратно?", "2,5 ч", ""], ["Поезд длиной 100 м едет со скоростью 36 км/ч. Пассажир встречного поезда (54 км/ч) видит его мимо себя. За какое время поезд пройдёт мимо пассажира?", "4 с", ""], ["Самолёт летит со скоростью 200 км/ч относительно воздуха. Ветер 20 км/ч дует вдоль маршрута. Сколько времени займёт полёт на 900 км туда и обратно?", "≈ 9,09 ч", ""]]}, {"ch": "dyn", "sub": "Законы Ньютона", "items": [["На тело массой 4 кг действует сила 20 Н. Найдите ускорение.", "5 м/с²", ""], ["С каким ускорением движется тело массой 2 кг под действием силы 6 Н? Какая сила нужна для ускорения 3 м/с²?", "a = 3 м/с², F = 6 Н", ""], ["Тело массой 5 кг увеличило скорость с 0 до 10 м/с за 2 с. Найдите ускорение и силу.", "a = 5 м/с², F = 25 Н", ""], ["На тело массой 2 кг действуют две взаимно перпендикулярные силы 6 Н и 8 Н. Найдите ускорение.", "5 м/с²", ""], ["На тело массой 5 кг действуют силы 10 и 20 Н. Найдите ускорение, если силы направлены в одну сторону, и если в противоположные.", "6 м/с² и 2 м/с²", ""], ["Автомобиль массой 1000 кг: сила тяги 2500 Н, сила сопротивления 500 Н. Найдите ускорение.", "2 м/с²", ""], ["Под действием силы тело массой 3 кг из покоя за 4 с достигло скорости 8 м/с. Найдите силу.", "6 Н", ""], ["Два тела взаимодействуют. Масса первого 2 кг, его ускорение 3 м/с². Масса второго 6 кг. Найдите ускорение второго.", "1 м/с²", "Третий закон: m₁a₁ = m₂a₂."], ["Как изменится ускорение тела, если силу увеличить в 3 раза, а массу в 2 раза?", "Увеличится в 1,5 раза", "a = F/m."], ["Пуля массой 10 г со скоростью 400 м/с пробила доску толщиной 8 см и остановилась. Найдите среднюю силу сопротивления.", "F = 10 кН", "a = v²/(2s) = 10⁶ м/с²."]]}, {"ch": "dyn", "sub": "Сила тяжести, вес, тяготение", "items": [["Найдите силу тяжести, действующую на тело массой 5 кг (g = 10 м/с²).", "50 Н", ""], ["Лифт поднимается с ускорением 2 м/с². Найдите вес человека массой 60 кг.", "720 Н", ""], ["Лифт опускается с ускорением 2 м/с². Найдите вес человека массой 60 кг.", "480 Н", ""], ["Лифт падает с ускорением g. Чему равен вес пассажира? Как называется это состояние?", "P = 0, невесомость", ""], ["Лифт движется равномерно вверх. Найдите вес человека массой 70 кг.", "700 Н", "a = 0."], ["Как изменится сила притяжения между двумя телами при увеличении расстояния между ними вдвое?", "Уменьшится в 4 раза", "F ∼ 1/r²."], ["Найдите ускорение свободного падения на высоте, равной радиусу Земли (над поверхностью). g₀ = 10 м/с².", "2,5 м/с²", "r = 2R, g = g₀/4."], ["Найдите силу притяжения двух шаров массой по 1000 кг на расстоянии 1 м (G = 6,67·10⁻¹¹ Н·м²/кг²).", "≈ 6,67·10⁻⁵ Н", "F = Gm²/r²."], ["Найдите ускорение свободного падения на Луне: M = 7,35·10²² кг, R = 1,74·10⁶ м.", "g ≈ 1,62 м/с²", ""], ["Динамометр с подвешенным грузом массой 2 кг в движущемся лифте показывает 26 Н. Найдите ускорение лифта и его направление.", "a = 3 м/с², направлено вверх", ""]]}, {"ch": "dyn", "sub": "Силы упругости и трения", "items": [["Пружина жёсткостью 200 Н/м растянута на 5 см. Найдите силу упругости.", "10 Н", ""], ["Груз массой 2 кг растянул подвешенную пружину на 4 см. Найдите жёсткость пружины.", "500 Н/м", ""], ["Две пружины жёсткостью 200 и 300 Н/м соединены последовательно, затем параллельно. Найдите общую жёсткость в каждом случае.", "120 Н/м и 500 Н/м", ""], ["Брусок массой 5 кг лежит на столе, μ = 0,2. Найдите силу трения скольжения и силу, нужную для равномерного движения.", "F_тр = 10 Н; F = 10 Н", ""], ["Брусок массой 2 кг тянут по столу силой 12 Н, μ = 0,3. Найдите ускорение.", "3 м/с²", ""], ["Максимальная сила трения покоя для ящика массой 20 кг при μ = 0,4. Сдвинется ли ящик под действием силы 70 Н?", "F_max = 80 Н; нет, 70 < 80 Н", ""], ["Автомобиль массой 1000 кг тормозит с заблокированными колёсами, μ = 0,5. Найдите ускорение и тормозной путь при скорости 20 м/с.", "a = 5 м/с², s = 40 м", ""], ["При растяжении пружины на 3 см сила упругости 6 Н. Какая сила возникнет при растяжении на 5 см?", "10 Н", ""], ["Брусок массой 5 кг тянут вверх под углом 30° к горизонту силой 20 Н, μ = 0,2. Найдите силу реакции опоры, силу трения и ускорение.", "N = 40 Н, F_тр = 8 Н, a ≈ 1,86 м/с²", ""], ["Брусок скользит по горизонтальной поверхности с начальной скоростью 10 м/с, μ = 0,1. Найдите время и путь до остановки.", "t = 10 с, s = 50 м", "a = μg = 1 м/с²."]]}, {"ch": "dyn", "sub": "Наклонная плоскость", "items": [["Найдите ускорение тела, скользящего без трения по наклонной плоскости с углом 30°.", "5 м/с²", ""], ["Угол наклона 30°, коэффициент трения 0,2. Найдите ускорение при соскальзывании.", "a ≈ 3,27 м/с²", ""], ["При каком угле наклона тело начнёт скользить, если μ = 1?", "45°", "tg α = μ."], ["Длина наклонной плоскости 5 м, высота 3 м, трения нет. Найдите ускорение, время и конечную скорость при скатывании из покоя.", "a = 6 м/с², t ≈ 1,29 с, v ≈ 7,75 м/с", ""], ["Груз массой 10 кг равномерно поднимают по гладкой наклонной плоскости с углом 30°. Найдите силу, направленную вдоль плоскости.", "50 Н", ""], ["Тот же груз поднимают равномерно, μ = 0,2. Найдите силу вдоль плоскости.", "F ≈ 67,32 Н", ""], ["Какой силой, направленной вдоль плоскости, надо удерживать груз 10 кг на гладкой наклонной плоскости с углом 30°?", "50 Н", ""], ["Брусок брошен вверх по гладкой плоскости (α = 30°) со скоростью 10 м/с. Найдите ускорение и путь до остановки.", "a = 5 м/с², s = 10 м", ""], ["Брусок съезжает с наклонной плоскости с углом 37° (sin = 0,6; cos = 0,8), μ = 0,5. Найдите ускорение.", "2 м/с²", ""], ["Найдите силу реакции опоры для тела массой 4 кг на плоскости с углом 60°.", "20 Н", "N = mg cos α."]]}, {"ch": "dyn", "sub": "Связанные тела", "items": [["Два груза массой 2 и 3 кг подвешены на нити через невесомый блок. Найдите ускорение и силу натяжения.", "a = 2 м/с², T = 24 Н", ""], ["Брусок массой 3 кг лежит на гладком столе и связан нитью через блок с грузом массой 1 кг. Найдите ускорение и натяжение.", "a = 2,5 м/с², T = 7,5 Н", ""], ["То же, но коэффициент трения бруска о стол 0,1.", "a = 1,75 м/с², T = 8,25 Н", ""], ["Два бруска массой 2 и 3 кг лежат на гладком столе, связаны нитью. К первому приложена сила 10 Н. Найдите ускорение и натяжение нити.", "a = 2 м/с², T = 6 Н", ""], ["Два бруска массой 1 и 4 кг на гладком столе связаны нитью. Силу 10 Н прикладывают ко второму. Найдите ускорение и натяжение.", "a = 2 м/с², T = 2 Н", ""], ["Масса кабины лифта 1000 кг, трос выдерживает 12 000 Н. С каким наибольшим ускорением можно поднимать кабину?", "2 м/с²", ""], ["Грузы 5 и 3 кг на нити через блок. Найдите ускорение, натяжение нити и силу давления на ось блока.", "a = 2,5 м/с², T = 37,5 Н, F = 75 Н", ""], ["Брусок массой 4 кг лежит на гладкой наклонной плоскости (α = 30°) и связан нитью через блок с вертикально висящим грузом массой 1 кг. Куда будет двигаться система? Найдите ускорение и натяжение.", "брусок скользит вниз, груз поднимается; a = 2 м/с², T = 12 Н", ""], ["Машина Атвуда: грузы 1 и 2 кг. Найдите ускорение и натяжение нити.", "a ≈ 3,33 м/с², T ≈ 13,33 Н", ""], ["Нить выдерживает силу 30 Н. К грузу m₁ = 2 кг через блок подвешивают груз m₂. Какова наибольшая допустимая масса m₂?", "6 кг", "T = 2m₁m₂g/(m₁+m₂) ≤ 30."]]}, {"ch": "dyn", "sub": "Динамика движения по окружности", "items": [["Автомобиль массой 1000 кг едет со скоростью 10 м/с по выпуклому мосту радиусом 40 м. Найдите силу давления на мост в верхней точке.", "7500 Н", ""], ["Тот же автомобиль проезжает вогнутый мост радиусом 40 м. Найдите силу давления в нижней точке.", "12500 Н", ""], ["При какой скорости автомобиль в верхней точке выпуклого моста радиусом 40 м перестанет давить на мост?", "20 м/с", ""], ["Найдите максимальную скорость, с которой автомобиль может проходить поворот радиусом 50 м, если μ = 0,5.", "v = √(μgR) ≈ 15,8 м/с", ""], ["Камень массой 0,2 кг на нити длиной 0,5 м вращается в вертикальной плоскости. В нижней точке его скорость 5 м/с. Найдите натяжение нити.", "12 Н", ""], ["Тот же камень в верхней точке имеет скорость 3 м/с. Найдите натяжение нити.", "1,6 Н", ""], ["Найдите минимальную скорость в верхней точке для груза на нити длиной 0,9 м (нить остаётся натянутой).", "3 м/с", ""], ["Конический маятник: нить с шариком массой 0,1 кг отклонена от вертикали на 60°. Найдите силу натяжения нити.", "2 Н", ""], ["Шарик массой 0,1 кг на нити длиной 0,5 м вращается по гладкому столу со скоростью 2 м/с. Найдите натяжение нити.", "0,8 Н", ""], ["Мотоциклист ездит по внутренней вертикальной стенке цилиндра радиусом 5 м, μ = 0,5. Найдите минимальную скорость, при которой он не соскользнёт.", "10 м/с", "μN = mg, N = mv²/R."]]}, {"ch": "dyn", "sub": "Тяготение и спутники", "items": [["Найдите первую космическую скорость Земли (g = 10 м/с², R = 6400 км).", "8 км/с", ""], ["Найдите скорость спутника на круговой орбите на высоте, равной радиусу Земли.", "v = v₁/√2 ≈ 5,66 км/с", ""], ["Найдите период обращения спутника у поверхности Земли.", "T ≈ 5027 с ≈ 84 мин", ""], ["Найдите ускорение свободного падения на высоте, равной трём радиусам Земли.", "0,625 м/с²", "r = 4R, g = g₀/16."], ["Найдите радиус геостационарной орбиты (M = 6·10²⁴ кг, G = 6,67·10⁻¹¹ Н·м²/кг², T = 86 400 с).", "r ≈ 42,3·10⁶ м", ""], ["Найдите вторую космическую скорость Земли.", "v₂ = √2·v₁ ≈ 11,3 км/с", ""], ["Масса планеты в 10 раз меньше земной, радиус в 2 раза меньше. Найдите g на планете и первую космическую скорость (R_З = 6400 км).", "g = 4 м/с², v₁ ≈ 3,58 км/с", ""], ["Найдите период спутника на круговой орбите радиусом 2R (g = 10 м/с², R = 6400 км).", "T = 2π√(r³/(gR²)) ≈ 14217 с", ""], ["Как изменится первая космическая скорость, если радиус планеты увеличить вдвое при неизменной средней плотности?", "Увеличится в 2 раза", "M ∼ R³, v² = GM/R ∼ R²."], ["Радиус орбиты второго спутника в 4 раза больше, чем первого. Найдите отношение периодов обращения.", "T₂/T₁ = 8", "Третий закон Кеплера: T² ∼ r³."]]}, {"ch": "cons", "sub": "Импульс и закон сохранения импульса", "items": [["Найдите импульс тела массой 2 кг, движущегося со скоростью 5 м/с.", "10 кг·м/с", ""], ["Мяч массой 0,5 кг летел со скоростью 10 м/с и отскочил от стенки с той же скоростью назад. Найдите изменение импульса.", "10 кг·м/с", "Δp = m(−v) − mv = −2mv. Модуль 10."], ["Удар длится 0,01 с, изменение импульса 10 кг·м/с. Найдите среднюю силу.", "1000 Н", ""], ["Масса ружья 4 кг, масса пули 10 г, скорость пули 600 м/с. Найдите скорость отдачи ружья.", "1,5 м/с", ""], ["Человек массой 60 кг бежит со скоростью 4 м/с, догоняет тележку массой 40 кг, движущуюся со скоростью 1 м/с, и вскакивает на неё. Найдите скорость тележки.", "2,8 м/с", ""], ["Человек массой 50 кг прыгает с неподвижной лодки массой 100 кг на берег со скоростью 2 м/с. Найдите скорость лодки.", "1 м/с", "Лодка движется в противоположную сторону."], ["Снаряд массой 20 кг летит со скоростью 200 м/с и разрывается на два осколка по 10 кг. Первый летит вперёд со скоростью 100 м/с. Найдите скорость второго.", "300 м/с", ""], ["Вагон массой 20 т движется со скоростью 0,5 м/с и сцепляется со стоящим вагоном массой 30 т. Найдите скорость после сцепки.", "0,2 м/с", ""], ["Ракета массой 2 кг выбросила порцию газа массой 0,1 кг со скоростью 500 м/с относительно земли. Найдите скорость ракеты (начальная скорость 0, массу ракеты после выброса считаем 2 кг).", "25 м/с", ""], ["На покоящееся тело массой 10 кг действует сила 50 Н в течение 4 с. Найдите конечную скорость.", "20 м/с", ""]]}, {"ch": "cons", "sub": "Столкновения тел", "items": [["Тело массой 2 кг со скоростью 3 м/с налетает на неподвижное тело массой 4 кг и слипается с ним. Найдите скорость после удара.", "1 м/с", ""], ["Тело массой 3 кг со скоростью 4 м/с движется навстречу телу массой 1 кг, имеющему скорость 8 м/с. После неупругого удара они движутся вместе. Найдите скорость.", "1 м/с", "Знаки проекций: направление первого — положительное."], ["Шар массой m со скоростью 5 м/с упруго ударяет в такой же покоящийся шар. Найдите скорости после удара.", "Первый останавливается, второй движется со скоростью 5 м/с", "Равные массы обмениваются скоростями."], ["Найдите потерю кинетической энергии в задаче 1 (2 кг со скоростью 3 м/с, 4 кг покоится).", "6 Дж", "Было 9 Дж, стало 3 Дж."], ["Шар массой 1 кг со скоростью 6 м/с упруго ударяет в покоящийся шар массой 2 кг. Найдите скорости после удара.", "v₁′ = −2 м/с, v₂′ = 4 м/с", ""], ["Пуля массой 10 г, летящая со скоростью 400 м/с, попадает в брусок массой 0,99 кг, подвешенный на нити, и застревает. Найдите скорость бруска и высоту подъёма.", "v = 4 м/с, h = 0,8 м", ""], ["Мяч массой 0,4 кг падает со скоростью 10 м/с и отскакивает со скоростью 8 м/с. Найдите изменение импульса.", "7,2 кг·м/с", ""], ["Удар из предыдущей задачи длится 0,02 с. Найдите среднюю силу удара.", "360 Н", ""], ["Шар массой 0,5 кг со скоростью 4 м/с упруго отскакивает от неподвижной стенки. Найдите изменение импульса.", "4 кг·м/с", ""], ["Два пластилиновых шарика одинаковой массы движутся по взаимно перпендикулярным направлениям со скоростями 3 и 4 м/с и слипаются. Найдите скорость после удара.", "2,5 м/с", "Векторная сумма импульсов: 5m."]]}, {"ch": "cons", "sub": "Работа и мощность", "items": [["К телу приложена сила 50 Н, направленная по перемещению. Перемещение 10 м. Найдите работу.", "500 Дж", ""], ["Сила 100 Н направлена под углом 60° к перемещению, перемещение 20 м. Найдите работу.", "1000 Дж", ""], ["Груз массой 5 кг поднимают на 4 м. Найдите работу силы тяжести и работу силы, поднимающей груз равномерно.", "−200 Дж и 200 Дж", ""], ["Кран поднимает груз массой 100 кг на высоту 10 м за 20 с. Найдите полезную мощность.", "500 Вт", ""], ["Автомобиль едет со скоростью 72 км/ч, сила тяги 1500 Н. Найдите мощность двигателя.", "30 кВт", ""], ["Мощность двигателя 60 кВт, скорость автомобиля 20 м/с. Найдите силу тяги.", "3000 Н", ""], ["Сила, действующая на тело, линейно возрастает от 0 до 10 Н на пути 5 м. Найдите работу по графику F(s).", "25 Дж", ""], ["Найдите работу, необходимую для сжатия пружины жёсткостью 400 Н/м на 5 см.", "0,5 Дж", ""], ["Ящик массой 20 кг тянут по полу на 5 м, μ = 0,3. Найдите модуль работы силы трения.", "300 Дж", ""], ["Груз массой 10 кг равномерно поднимают по гладкой наклонной плоскости с углом 30° на расстояние 4 м вдоль плоскости. Найдите работу.", "200 Дж", ""]]}, {"ch": "cons", "sub": "Энергия и закон сохранения энергии", "items": [["Найдите кинетическую энергию тела массой 2 кг, движущегося со скоростью 6 м/с.", "36 Дж", ""], ["Найдите потенциальную энергию тела массой 3 кг на высоте 5 м.", "150 Дж", ""], ["С какой скоростью упадёт на землю тело, падающее без начальной скорости с высоты 20 м?", "20 м/с", ""], ["Тело брошено вверх со скоростью 15 м/с. Найдите максимальную высоту подъёма.", "11,25 м", ""], ["Тело падает с высоты 20 м. Найдите скорость на высоте 5 м.", "v ≈ 17,32 м/с", ""], ["Пружина жёсткостью 100 Н/м сжата на 10 см. Какую скорость она сообщит шарику массой 0,1 кг?", "E = 0,5 Дж, v ≈ 3,16 м/с", ""], ["Маятник длиной 1 м отклонили на 60° от вертикали и отпустили. Найдите скорость в нижней точке.", "v ≈ 3,16 м/с", ""], ["С ледяной горки высотой 10 м скатываются санки (трения нет). Найдите скорость у подножия.", "v ≈ 14,14 м/с", ""], ["Автомобиль массой 1000 кг разгоняется с 10 до 20 м/с. Найдите работу силы тяги (потерями пренебречь).", "150 кДж", ""], ["Груз массой 2 кг падает с высоты 1 м на вертикальную пружину жёсткостью 1000 Н/м. Найдите наибольшее сжатие пружины.", "x ≈ 0,22 м", "mg(h + x) = kx²/2."]]}, {"ch": "cons", "sub": "КПД и энергия при наличии трения", "items": [["Полезная работа 300 Дж, затраченная 500 Дж. Найдите КПД.", "60 %", ""], ["Насос поднимает 100 кг воды на высоту 10 м за 10 с. Мощность двигателя 2 кВт. Найдите КПД установки.", "50 %", "Полезная мощность 1000 Вт, затраченная 2000 Вт."], ["Груз массой 50 кг поднимают на высоту 1 м по наклонной плоскости длиной 5 м силой 150 Н. Найдите КПД.", "66,7 %", "η = mgh/(Fl)."], ["Санки массой 40 кг скатились с горки высотой 10 м и у подножия имеют скорость 10 м/с. Найдите выделившуюся теплоту.", "2000 Дж", ""], ["Автомобиль массой 1000 кг, двигавшийся со скоростью 20 м/с, остановился при торможении. Какое количество теплоты выделилось?", "200 кДж", ""], ["Шайба скользит по льду с начальной скоростью 5 м/с, μ = 0,05. Найдите путь до остановки.", "25 м", ""], ["Брусок съезжает с плоскости с углом 30° и высотой 2 м, μ = 0,2. Найдите скорость у подножия.", "v ≈ 5,11 м/с", "E = mgh − μmg cos α · h/sin α."], ["Мощность двигателя 60 кВт, КПД 25%. Найдите расход бензина за час (q = 46 МДж/кг).", "18,8 кг", ""], ["Мяч массой 0,5 кг брошен вверх со скоростью 20 м/с и достиг высоты 15 м. Найдите потерю механической энергии на сопротивление воздуха.", "25 Дж", ""], ["Мячик падает с высоты 5 м и отскакивает на высоту 3,2 м. Какая доля энергии потеряна?", "36 %", ""]]}, {"ch": "stat", "sub": "Момент силы и рычаг", "items": [["К рычагу на расстоянии 0,5 м от оси приложена сила 20 Н. Какую силу надо приложить на расстоянии 0,2 м с другой стороны для равновесия?", "50 Н", ""], ["Груз массой 10 кг подвешен на расстоянии 0,2 м от оси рычага. На каком расстоянии от оси надо приложить силу 20 Н, чтобы уравновесить груз?", "1 м", ""], ["Невесомая планка длиной 2 м; на концы действуют силы 15 Н и 45 Н. Найдите положение опоры, при котором планка в равновесии.", "плечи 1,5 м (у силы 15 Н) и 0,5 м (у силы 45 Н)", "F₁d₁ = F₂d₂, d₁ + d₂ = 2."], ["Качели-доска. Мальчик 30 кг сидит в 2 м от опоры. На каком расстоянии от опоры должен сидеть мальчик 40 кг?", "1,5 м", "m₁d₁ = m₂d₂."], ["Однородное бревно массой 100 кг приподнимают за один конец. Какая сила нужна?", "500 Н", "Моменты относительно другого конца: F·L = mg·L/2."], ["Однородная лестница массой 10 кг стоит у гладкой стены под углом 60° к полу. Найдите силу реакции стены.", "N ≈ 28,9 Н", "N·L sin α = mg·(L/2)cos α."], ["С помощью подвижного блока равномерно поднимают груз массой 80 кг. Какую силу прикладывают (вес блока не учитываем)? Какой выигрыш в силе?", "F = 400 Н; выигрыш в 2 раза", ""], ["Стержень массой 20 кг, длиной 4 м лежит на двух опорах на концах. На расстоянии 1 м от левого конца лежит груз 10 кг. Найдите силы реакции опор.", "N₁ = 175 Н, N₂ = 125 Н", ""], ["На концах невесомого стержня длиной 2 м закреплены грузы 1 и 3 кг. Где находится центр тяжести?", "1,5 м от груза 1 кг", ""], ["Какую силу нужно приложить к рычагу, если плечо силы 1 м, а плечо груза 25 см, масса груза 40 кг?", "100 Н", ""]]}, {"ch": "stat", "sub": "Давление и гидростатика", "items": [["Найдите давление воды на глубине 5 м (ρ = 1000 кг/м³, g = 10 м/с²).", "50000 Па", ""], ["Сила 400 Н действует перпендикулярно поверхности площадью 0,02 м². Найдите давление.", "20000 Па", ""], ["В сосуд налит керосин (ρ = 800 кг/м³) до высоты 0,5 м. Найдите давление и силу на дно площадью 0,01 м².", "p = 4000 Па, F = 40 Н", ""], ["Площади поршней гидравлического пресса 10 см² и 200 см². К малому поршню приложена сила 100 Н. Найдите силу на большом поршне.", "2000 Н", ""], ["Человек массой 60 кг стоит на двух ногах, площадь опоры каждой подошвы 0,02 м². Найдите давление на пол.", "15000 Па", ""], ["Найдите полное давление на глубине 10 м в воде (атмосферное давление 10⁵ Па).", "200000 Па", ""], ["Найдите давление столба ртути высотой 760 мм (ρ = 13 600 кг/м³, g = 10 м/с²).", "≈ 103360 Па", ""], ["В U-образную трубку налита вода. В одно колено налили слой нефти (ρ = 800 кг/м³) высотой 25 см. На сколько уровень нефти в одном колене выше уровня воды в другом?", "на 5 см (столб воды над границей раздела 20 см)", "ρ_н h_н = ρ_в h_в."], ["Водолаз работает на глубине 30 м. Найдите гидростатическое давление и силу на иллюминатор площадью 0,02 м².", "p = 300000 Па, F = 6000 Н", ""], ["Кирпич массой 2 кг имеет размеры 20×10×5 см. Найдите наибольшее и наименьшее давление на опору.", "4000 Па и 1000 Па", ""]]}, {"ch": "stat", "sub": "Закон Архимеда и плавание", "items": [["Найдите силу Архимеда, действующую на полностью погружённое в воду тело объёмом 0,002 м³.", "20 Н", ""], ["Тело массой 5 кг объёмом 0,001 м³ полностью погружено в воду. Найдите силу Архимеда и вес тела в воде.", "F_A = 10 Н, P = 40 Н", ""], ["Деревянный брусок плотностью 600 кг/м³ плавает в воде. Какая доля объёма погружена?", "0,6", "V_погр/V = ρ_тела/ρ_ж."], ["Льдина плотностью 900 кг/м³ плавает в воде. Какая доля её объёма над водой?", "10 %", ""], ["Найдите силу Архимеда для шара объёмом 0,01 м³, погружённого в керосин (ρ = 800 кг/м³).", "80 Н", ""], ["Пробка массой 0,2 кг плавает на воде. Найдите объём погружённой части.", "200 см³", ""], ["Железный шар массой 1 кг (ρ = 7800 кг/м³) погружён в воду. Найдите силу Архимеда и показание динамометра.", "F_A ≈ 1,28 Н, P ≈ 8,72 Н", ""], ["Плот объёмом 1 м³ из дерева плотностью 500 кг/м³ плавает в воде. Какую наибольшую массу груза он может нести?", "500 кг", "F_A = (m_плота + m)g."], ["Плотность льда 900 кг/м³, морской воды 1030 кг/м³. Какая доля объёма айсберга под водой?", "≈ 87%", ""], ["Динамометр показывает 10 Н в воздухе и 6 Н в воде. Найдите объём и плотность тела.", "V = 4·10⁻⁴ м³ = 400 см³, ρ = 2500 кг/м³", ""]]}, {"ch": "mkt", "sub": "Количество вещества и молекулы", "items": [["Найдите количество вещества и число молекул в 18 г воды (M = 0,018 кг/моль).", "ν = 1 моль, N = 6,02·10²³", ""], ["Найдите количество вещества в 2 кг углекислого газа (M = 0,044 кг/моль).", "45,5 моль", ""], ["Найдите число молекул в 1 г водорода H₂ (M = 0,002 кг/моль).", "3,01·10²³", ""], ["Найдите массу одной молекулы воды.", "2,99·10⁻²⁶ кг", ""], ["Сколько атомов содержится в 56 г железа (M = 0,056 кг/моль)?", "6,02·10²³", ""], ["Найдите концентрацию молекул воды (ρ = 1000 кг/м³, M = 0,018 кг/моль).", "3,34·10²⁸ м⁻³", ""], ["Найдите объём, приходящийся на одну молекулу воды, и оценку её размера.", "V₀ ≈ 2,99·10⁻²⁹ м³, d ≈ 3,1·10⁻¹⁰ м", ""], ["Сколько молекул содержится в 1 л воды?", "≈ 3,34·10²⁵", ""], ["Масса 8 г газа соответствует количеству вещества 0,25 моль. Найдите молярную массу. Что это за газ?", "M = 0,032 кг/моль, кислород O₂", ""], ["Найдите молярную массу серной кислоты H₂SO₄.", "M = 98·10⁻³ = 0,098 кг/моль", "2·1 + 32 + 4·16 = 98."]]}, {"ch": "mkt", "sub": "Основное уравнение МКТ и температура", "items": [["Найдите среднюю кинетическую энергию поступательного движения молекул при 27 °C.", "6,21·10⁻²¹ Дж", ""], ["Найдите среднюю квадратичную скорость молекул кислорода при 300 К (M = 0,032 кг/моль).", "483 м/с", ""], ["Найдите давление газа при концентрации молекул 2,7·10²⁵ м⁻³ и температуре 300 К.", "p = nkT ≈ 1,12·10⁵ Па", ""], ["Как изменится средняя кинетическая энергия молекул при увеличении абсолютной температуры в 2 раза?", "Увеличится в 2 раза", ""], ["Во сколько раз изменится средняя квадратичная скорость молекул при увеличении температуры в 4 раза?", "Увеличится в 2 раза", "v ∼ √T."], ["Концентрация молекул 3·10²⁵ м⁻³, средняя кинетическая энергия 6·10⁻²¹ Дж. Найдите давление.", "p = (2/3) n E = 1,2·10⁵ Па", ""], ["Найдите температуру газа, если средняя кинетическая энергия молекул 6,21·10⁻²¹ Дж.", "300 К", ""], ["Найдите среднюю квадратичную скорость атомов гелия при 300 К (M = 0,004 кг/моль).", "1367 м/с", ""], ["Выразите температуру −173 °C в кельвинах.", "100 К", ""], ["Масса молекулы кислорода 5,3·10⁻²⁶ кг, концентрация 2,7·10²⁵ м⁻³, средний квадрат скорости 2,3·10⁵ м²/с². Найдите давление.", "p = (1/3)m₀nv² ≈ 1,1·10⁵ Па", ""]]}, {"ch": "mkt", "sub": "Уравнение состояния идеального газа", "items": [["Найдите давление 2 моль газа в сосуде объёмом 10 л при 300 К.", "499 кПа", ""], ["Найдите объём 1 моль идеального газа при нормальных условиях (p = 101 325 Па, T = 273 К).", "22,4 л", ""], ["В баллоне объёмом 20 л находится кислород при давлении 10⁶ Па и температуре 300 К. Найдите массу кислорода (M = 0,032 кг/моль).", "0,257 кг", ""], ["Найдите плотность азота (M = 0,028 кг/моль) при давлении 10⁵ Па и температуре 300 К.", "1,12 кг/м³", ""], ["Газ изменил состояние: p₁ = 10⁵ Па, V₁ = 2 л, T₁ = 300 К → V₂ = 3 л, T₂ = 450 К. Найдите p₂.", "100000 Па", ""], ["В сосуде объёмом 20 л находятся 2 моль одного газа и 3 моль другого при 300 К. Найдите давление смеси.", "623 кПа", ""], ["Газ нагрели от 27 °C до 127 °C при постоянном объёме. Во сколько раз увеличилось давление?", "1,33 раза", ""], ["Из баллона выпустили половину газа при постоянной температуре. Как изменилось давление?", "Уменьшилось в 2 раза", "p ∼ m при V, T = const."], ["Какой объём занимают 8 г кислорода при 27 °C и давлении 10⁵ Па?", "6,23 л", ""], ["Найдите концентрацию молекул газа при давлении 10⁵ Па и температуре 300 К.", "2,42·10²⁵ м⁻³", ""]]}, {"ch": "mkt", "sub": "Изопроцессы", "items": [["Давление газа 2·10⁵ Па, объём 3 л. Газ изотермически расширили до 6 л. Найдите новое давление.", "100000 Па", ""], ["Газ объёмом 2 л при 300 К нагрели изобарно до 600 К. Найдите новый объём.", "4 л", ""], ["Давление газа в закрытом сосуде 10⁵ Па при 300 К. Найдите давление при 450 К.", "150000 Па", ""], ["Газ при 27 °C занимает объём 6 л. До какой температуры его надо нагреть при постоянном давлении, чтобы объём стал 8 л?", "T = 400 К = 127 °C", ""], ["Давление воздуха в шине при 7 °C равно 2,8·10⁵ Па. Каким оно станет при 37 °C (объём считаем постоянным)?", "310000 Па", ""], ["Воздух объёмом 0,01 м³ при давлении 100 кПа изотермически сжали до объёма 0,004 м³. Найдите давление.", "250 кПа", ""], ["Газ в баллоне при 17 °C имеет давление 1,2 МПа. При какой температуре давление станет 1,5 МПа?", "T = 362,5 К ≈ 89,5 °C", ""], ["Пузырёк воздуха объёмом 1 см³ поднимается со дна озера глубиной 10 м (p₀ = 10⁵ Па, температуру считаем постоянной). Найдите объём у поверхности.", "2 см³", "p₁ = p₀ + ρgh = 2·10⁵ Па."], ["При изобарном нагревании газа на 50 К его объём увеличился на 10%. Найдите начальную температуру.", "500 К", "ΔV/V = ΔT/T."], ["Давление газа пропорционально объёму: p = aV. Как изменится температура, если объём увеличить вдвое?", "Увеличится в 4 раза", "pV/T = const, pV ∼ V²."]]}, {"ch": "mkt", "sub": "Влажность воздуха и насыщенный пар", "items": [["Парциальное давление водяного пара 1,2 кПа, давление насыщенного пара при этой температуре 2,4 кПа. Найдите относительную влажность.", "50 %", ""], ["Найдите парциальное давление пара при влажности 60% и температуре 25 °C (p_н = 3,17 кПа).", "1,9 кПа", ""], ["Найдите абсолютную влажность (плотность пара) в предыдущей задаче (T = 298 К, M = 0,018 кг/моль).", "ρ = pM/(RT) ≈ 13,8 г/м³", ""], ["При 20 °C давление насыщенного пара 2,33 кПа. Найдите парциальное давление пара при влажности 50%.", "1,17 кПа", ""], ["В комнате объёмом 50 м³ при 20 °C относительная влажность 60%. Плотность насыщенного пара при этой температуре 17,3 г/м³. Найдите массу пара.", "519 г", ""], ["Парциальное давление пара 1,4 кПа при 27 °C. Воздух охладили до 7 °C, где p_н = 1,0 кПа. Выпадет ли роса?", "Да: 1,4 кПа > 1,0 кПа, избыток пара конденсируется.", ""], ["Почему в горах вода кипит при температуре ниже 100 °C?", "С высотой атмосферное давление падает, а кипение начинается, когда давление насыщенного пара равно внешнему.", ""], ["В 100 м³ воздуха при охлаждении плотность пара уменьшилась с 15 до 9 г/м³ (насыщение). Сколько воды выпало в виде росы?", "600 г", ""], ["При 100 °C давление насыщенного пара 101,3 кПа. Какова относительная влажность, если парциальное давление пара 50,6 кПа?", "50 %", ""], ["Как ведёт себя давление насыщенного пара при нагревании и почему оно не подчиняется закону Шарля?", "Растёт быстрее: при нагреве увеличивается и температура, и число молекул пара (часть жидкости испаряется).", ""]]}, {"ch": "mkt", "sub": "Поверхностное натяжение и твёрдые тела", "items": [["Найдите силу поверхностного натяжения, действующую на границу длиной 5 см (σ = 0,072 Н/м).", "3,6·10⁻³ Н", ""], ["Проволочная рамка с подвижной перемычкой длиной 4 см затянута мыльной плёнкой (σ = 0,04 Н/м). Найдите силу, действующую на перемычку (у плёнки две поверхности).", "3,2·10⁻³ Н", ""], ["На какую высоту поднимется вода в капилляре радиусом 0,5 мм? (σ = 0,072 Н/м, полное смачивание)", "h = 2σ/(ρgr) ≈ 2,9 см", ""], ["Найдите избыточное давление внутри капли ртути радиусом 1 мм (σ = 0,47 Н/м).", "940 Па", ""], ["Стальная игла длиной 5 см лежит на поверхности воды. Какова наибольшая масса иглы, при которой она не утонет (σ = 0,072 Н/м, две границы)?", "m ≈ 0,72 г", ""], ["Стальной стержень длиной 2 м и сечением 1 мм² растягивают силой 200 Н. Найдите удлинение (E = 2·10¹¹ Па).", "Δl = 2 мм", ""], ["Найдите механическое напряжение в стержне из предыдущей задачи.", "2·10⁸ Па", ""], ["Найдите относительное удлинение стержня из предыдущей задачи.", "0,001", ""], ["Стальной рельс длиной 25 м нагрели от −20 °C до 40 °C (α = 1,2·10⁻⁵ К⁻¹). Найдите удлинение.", "18 мм", ""], ["Найдите жёсткость стержня длиной 2 м сечением 1 мм² (E = 2·10¹¹ Па).", "100000 Н/м", "k = ES/l₀."]]}, {"ch": "thermo", "sub": "Работа газа и внутренняя энергия", "items": [["Газ расширился при давлении 2·10⁵ Па от 3 до 5 л. Найдите работу газа.", "400 Дж", ""], ["Газ сжимают при постоянном давлении 10⁵ Па, объём уменьшился на 4 л. Найдите работу газа и работу внешних сил.", "A = −400 Дж; A′ = +400 Дж", ""], ["При расширении давление газа линейно уменьшалось от 3·10⁵ до 1·10⁵ Па, а объём вырос от 1 до 3 л. Найдите работу по графику.", "400 Дж", "Площадь трапеции."], ["Найдите изменение внутренней эне енней энергии.", "A = 1000 Дж, ΔU = 1000 Дж", ""]]}, {"ch": "thermo", "sub": "Количество теплоты и теплообмен", "items": [["Какое количество теплоты нужно, чтобы нагреть 2 кг воды от 20 до 80 °C? (c = 4200 Дж/(кг·К))", "504 кДж", ""], ["Какое количество теплоты нужно, чтобы расплавить 0,5 кг льда при 0 °C? (λ = 3,3·10⁵ Дж/кг)", "165 кДж", ""], ["Сколько теплоты нужно, чтобы нагреть 1 кг льда от −10 до 0 °C и полностью расплавить (c = 2100 Дж/(кг·К))?", "351 кДж", ""], ["Сколько теплоты нужно, чтобы превратить в пар 0,2 кг воды при 100 °C? (L = 2,3·10⁶ Дж/кг)", "460 кДж", ""], ["Смешали 2 кг воды при 80 °C и 3 кг воды при 20 °C. Найдите температуру смеси.", "44 °C", ""], ["Медное тело массой 0,5 кг при 100 °C (c = 400 Дж/(кг·К)) опустили в 1 кг воды при 20 °C. Найдите установившуюся температуру.", "23,6 °C", ""], ["1 кг воды при 20 °C остывает до 0 °C и отдаёт тепло льду при 0 °C. Сколько льда растает?", "0,255 кг", ""], ["Электрочайник мощностью 1 кВт с КПД 80% нагревает 2 кг воды от 20 до 100 °C. Сколько времени это займёт?", "840 с", ""], ["Сколько бензина (q = 46 МДж/кг) нужно сжечь, чтобы нагреть 10 кг воды от 20 до 100 °C, если на нагрев идёт 40% теплоты?", "0,183 кг", ""], ["Металлический цилиндр массой 0,2 кг при 100 °C опустили в 0,3 кг воды при 20 °C. Температура стала 24 °C. Найдите удельную теплоёмкость металла.", "332 Дж/(кг·К)", ""]]}, {"ch": "thermo", "sub": "КПД теплового двигателя и циклы", "items": [["Двигатель получил от нагревателя 1000 Дж и отдал холодильнику 700 Дж. Найдите КПД и работу.", "η = 30%, A = 300 Дж", ""], ["Найдите КПД идеальной тепловой машины Карно при температуре нагревателя 600 К и холодильника 300 К.", "50 %", ""], ["Температура нагревателя 500 К, холодильника 300 К. Найдите максимально возможный КПД.", "40 %", ""], ["Мощность двигателя 20 кВт, КПД 25%. Сколько бензина (q = 46 МДж/кг) он сжигает за час?", "6,3 кг", ""], ["Тепловая машина за цикл совершает работу 200 Дж, КПД 20%. Найдите количество теплоты от нагревателя и отданн <script type="text/plain" data-legacy>
let tdone=store.get('fiz10_tasks'),tch='kin';
function renderTasks(){
 const ids=[...new Set(TASKS.map(t=>t.ch))];
 const total=TASKS.reduce((a,t)=>a+t.items.length,0);
 let h=`<p class="note" style="margin:14px 0 0">${total} задач по ${TASKS.length} подтемам. В каждой подтеме 10 задач, в начале проще, в конце сложнее. Сначала реши сам, потом открой ответ. Отмечай решённые.</p><div class="chips tchips">`+ids.map(id=>{const c=S.find(x=>x.id===id);return `<button class="chip ${id===tch?'on':''}" data-tch="${id}">${c.t.split(':')[0]}</button>`}).join('')+'</div>';
 TASKS.forEach((t,ti)=>{
  if(t.ch!==tch)return;
  const k=t.items.filter((_,i)=>tdone.includes(ti+'.'+i)).length;
  h+=`<details class="ch" data-ti="${ti}"><summary><span class="ttl">${t.sub}<span class="cnt"><span class="kc">${k}</span> из ${t.items.length} решено</span></span><span class="chev"></span></summary><div class="body"><ol class="tl">`;
  t.items.forEach((it,i)=>{
   const id=ti+'.'+i,ok=tdone.includes(id);
   h+=`<li class="${ok?'dn':''}"><div class="tx">${it[0]}</div><div class="tk"><label><input type="checkbox" data-task="${id}" ${ok?'checked':''}> решил</label><details class="ans"><summary>Ответ</summary><div class="av"><b>${it[1]}</b>${it[2]?'<br><span class="note">'+it[2]+'</span>':''}</div></details></div></li>`;
  });
  h+='</ol></div></details>';
 });
 $('#tasks').innerHTML=h;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tch]');if(b){tch=b.dataset.tch;renderTasks()}});
document.addEventListener('change',e=>{
 const id=e.target.dataset&&e.target.dataset.task;
 if(!id)return;
 tdone=e.target.checked?[...new Set([...tdone,id])]:tdone.filter(x=>x!==id);store.set('fiz10_tasks',tdone);
 e.target.closest('li').classList.toggle('dn',e.target.checked);
 const d=e.target.closest('details.ch'),ti=d.dataset.ti;
 d.querySelector('.kc').textContent=TASKS[ti].items.filter((_,i)=>tdone.includes(ti+'.'+i)).length;
});

</script>
