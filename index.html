<body>
<template id="legacy-css">

details.ch{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:12px;scroll-margin-top:70px}
details.ch>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px}
details.ch>summary::-webkit-details-marker{display:none}
.no{flex:0 0 auto;width:30px;height:30px;border-radius:7px;background:var(--accent-tint);color:var(--accent);display:grid;place-items:center;font:600 14px var(--f-math)}
details.ch.isdone .no{background:var(--ok-tint);color:var(--ok)}
.ttl{flex:1;min-width:0;font-weight:600;font-size:16px;line-height:1.3}
.cnt{font-size:12px;color:var(--muted);font-weight:400;display:block}
.chev{flex:0 0 auto;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
details[open]>summary .chev{transform:rotate(-135deg)}
.body{padding:0 14px 16px;border-top:1px solid var(--line)}
h3.sub{font-family:var(--f-disp);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 6px}
h4.grp{font-size:15px;margin:20px 0 4px;font-weight:600}
ul.pts{margin:6px 0;padding-left:20px}
ul.pts li{margin:4px 0}
.row{display:grid;grid-template-columns:1fr;gap:2px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.nm{font-size:13px;color:var(--muted)}
.fm{font-family:var(--f-math);font-size:20px;color:var(--accent);overflow-x:auto;max-width:100%;padding:2px 0}
.nt{font-size:13px;color:var(--muted);min-width:0}
@media (min-width:640px){.row{grid-template-columns:200px 1fr;column-gap:16px}.nt{grid-column:2}}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.1}
.fr>span:first-child{border-bottom:1.3px solid currentColor;padding:0 3px 1px}
.fr>span:last-child{padding:1px 3px 0}
.rt{white-space:nowrap}.rt>span{border-top:1.3px solid currentColor;padding:0 2px}
.v{position:relative;display:inline-block}.v::before{content:"→";position:absolute;top:-.62em;left:.08em;font-size:.65em}
sub,sup{line-height:0;font-size:.7em}
.tip{background:var(--accent-tint);border-radius:8px;padding:10px 12px;margin-top:14px;font-size:14px}
.tip b{display:block;margin-bottom:2px}
.tip ul{margin:4px 0 0;padding-left:18px}
.vids{margin:6px 0 0;padding:0;list-style:none}
.vids li{padding:4px 0}
.mark{display:flex;align-items:center;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-weight:500;cursor:pointer}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);flex:0 0 auto}
.empty{color:var(--muted);padding:24px 0;text-align:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.card h2{font-size:17px;margin:0 0 6px}
.card p{margin:6px 0}
.week{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line)}
.week:last-child{border-bottom:0}
.week label{display:flex;gap:12px;align-items:flex-start;cursor:pointer;min-width:0}
.wk{font-family:var(--f-math);font-size:13px;color:var(--muted)}
.week b{display:block}
.week.isdone b{color:var(--ok)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
td.val{font-family:var(--f-math);font-size:16px;white-space:nowrap}
.note{color:var(--muted);font-size:13px}

header .lead{color:var(--head-fg);opacity:.88}
header .bar{background:rgba(255,255,255,.28)}
header .bar i{background:var(--sun)}
header .prog span{color:var(--head-fg)}
.themebtn{font:600 13px var(--f-body);padding:8px 12px;border-radius:8px;border:1.5px solid var(--head-fg);background:transparent;color:var(--head-fg);cursor:pointer}
.no{background:var(--sun);color:#1a1a1a}
details.ch.isdone .no{background:var(--ok);color:#fff}
.seg{display:flex;gap:6px;margin:14px 0 4px}
.sg{flex:1;font:600 14px var(--f-body);padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.sg small{opacity:.7;font-weight:500}
.sg.on{background:var(--hot);color:var(--hot-fg);border-color:var(--hot)}
.pane[hidden]{display:none}
figure.dg{margin:14px 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
figure.dg svg{display:block;width:100%;max-width:460px;margin:0 auto;height:auto}
figure.dg figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.dg text{fill:var(--fg);font:12px var(--f-body)}
.dg .ta{fill:var(--accent)}.dg .th{fill:var(--hot)}.dg .to{fill:var(--ok)}.dg .m{fill:var(--muted)}
.dg .s{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dg .acc{stroke:var(--accent)}.dg .hot{stroke:var(--hot)}.dg .ok{stroke:var(--ok)}
.dg .mu{stroke:var(--muted);stroke-width:1.3}.dg .da{stroke-dasharray:4 4}
.dg polygon{stroke:none}.dg polygon.acc{fill:var(--accent)}.dg polygon.hot{fill:var(--hot)}.dg polygon.ok{fill:var(--ok)}.dg polygon.mu{fill:var(--muted)}
.dg .sh{fill:var(--sun-tint);stroke:none}.dg circle{fill:var(--fg)}.dg .bk{fill:var(--accent-tint);stroke:var(--accent);stroke-width:2}

.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tchips{padding:14px 0 2px}
ol.tl{margin:0;padding:0;list-style:none;counter-reset:t}
ol.tl>li{counter-increment:t;padding:12px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:28px 1fr;gap:4px 10px}
ol.tl>li:last-child{border-bottom:0}
ol.tl>li::before{content:counter(t);font:600 13px var(--f-math);width:24px;height:24px;border-radius:6px;background:var(--sun);color:#1a1a1a;display:grid;place-items:center;grid-row:1}
ol.tl>li.dn::before{background:var(--ok);color:#fff}
.tx{min-width:0}.tk{grid-column:2;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;font-size:14px}
.tk label{display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--muted)}
.tk input{width:18px;height:18px}
details.ans{min-width:0}
details.ans>summary{cursor:pointer;color:var(--hot);font-weight:600;list-style:none}
details.ans>summary::-webkit-details-marker{display:none}
details.ans[open]>summary{margin-bottom:4px}
.av{background:var(--accent-tint);border-radius:8px;padding:8px 10px;font-size:14px}
.av b{font-family:var(--f-math);font-size:17px}
.lvl{font-size:12px;color:var(--muted);margin:2px 0 0}

.row{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px;margin:10px 0;display:block}
.row:last-child{border-bottom:1px solid var(--line)}
.row .nm{font-size:14px;font-weight:600;color:var(--fg)}
.row .fm{font-size:22px;background:var(--surface);border-radius:8px;padding:8px 10px;margin:6px 0;text-align:center}
.lg{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}
.lg b{color:var(--fg)}.lg i{font:italic 15px var(--f-math);color:var(--accent)}.lg .ix{flex-basis:100%}
.row .nt{margin-top:6px;padding:6px 10px;background:var(--sun-tint);border-radius:6px;color:var(--fg)}
@media (min-width:640px){.row{grid-template-columns:none}.nt{grid-column:auto}}
.qrow{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:start}
.qs{font:600 20px var(--f-math);color:var(--accent);background:var(--accent-tint);border-radius:8px;text-align:center;padding:4px 2px;word-break:break-all}
.qu{font-size:13px;color:var(--accent);font-family:var(--f-math)}
details.adv{margin-top:18px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
details.adv>summary{cursor:pointer;font-weight:600;color:var(--hot)}

/* ---------- вкладка «ЕГЭ 2027» ---------- */
details.eg{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:12px;scroll-margin-top:70px}
details.eg>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px}
details.eg>summary::-webkit-details-marker{display:none}
.egl details.ans{flex:1 1 100%}
.egl .tx{line-height:1.5}
.egl .av .sol{margin-top:6px;font-size:14px;line-height:1.5}
.egl .av .sol b{font-family:inherit;font-size:inherit}
.egmeta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.egmeta span{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted)}
.egstat{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.egstat b{font:600 13px var(--f-math);background:var(--accent-tint);color:var(--accent);border-radius:6px;padding:3px 8px}

/* ---------- вкладка «Повторение» ---------- */
.fcm{flex:1;font:600 14px var(--f-body);padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.fcm.on{background:var(--hot);color:var(--hot-fg);border-color:var(--hot)}
.fcbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.fcb{font:500 14px var(--f-body);padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.fcb.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.fcb.big{padding:12px 28px;font-weight:600}
.pbar{display:flex;height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%}
.fcx{perspective:1200px;margin-top:12px}
.fc{cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.fc:focus-visible .fc-face{outline:2px solid var(--accent);outline-offset:2px}
.fc-in{display:grid;transition:transform .45s;transform-style:preserve-3d}
.fc.flipped .fc-in{transform:rotateY(180deg)}
.fc-face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 16px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:230px}
.fc-face.back{transform:rotateY(180deg);background:var(--accent-tint)}
.fc-cap{font-size:12px;color:var(--muted);margin-bottom:12px}
.fc-main{display:block;font-size:19px;line-height:1.5;overflow-wrap:break-word;max-width:100%}
.fc-main.fc-math{font-family:var(--f-math);font-size:24px;color:var(--accent)}
.fc-main.fc-long{font-size:16px}
.fcgr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.fcgr[hidden]{display:none}
.gr{font:inherit;display:flex;flex-direction:column;gap:2px;align-items:center;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.gr b{font:600 14px var(--f-body)}.gr span{font-size:11px;color:var(--muted)}
.gr.g0{border-color:var(--hot)}.gr.g1{border-color:var(--sun)}.gr.g2{border-color:var(--accent)}.gr.g3{border-color:var(--ok)}
.gr:active{background:var(--accent-tint)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</template>

<!-- Данные курса: теория, формулы, величины, схемы, задачи, ЕГЭ, карточки. Логика старой версии отключена (type="text/plain"). -->
<script>
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const rt=x=>`<span class="rt">√<span>${x}</span></span>`;
const V=x=>`<span class="v">${x}</span>`;

const S=[
{id:'intro',t:'Введение: величины, СИ, математика',
 theory:[
  'Физика описывает мир через <b>физические величины</b> (путь, масса, сила) и <b>законы</b> — связи между ними. Законы работают для <b>моделей</b>: материальная точка, идеальный газ, точечный заряд.',
  '<b>Скаляры</b> имеют только значение (путь, время, масса, энергия, работа, температура, заряд). <b>Векторы</b> имеют ещё и направление (перемещение, скорость, ускорение, сила, импульс, напряжённость поля).',
  'Любую физическую задачу решает один и тот же алгоритм. Выучи его, и задачи перестанут быть набором трюков.'],
 groups:[
  {t:'Приставки и перевод единиц',rows:[
   ['Малые приставки','нано (н) = 10<sup>−9</sup>, микро (мк) = 10<sup>−6</sup>, милли (м) = 10<sup>−3</sup>, санти (с) = 10<sup>−2</sup>, деци (д) = 10<sup>−1</sup>'],
   ['Большие приставки','кило (к) = 10<sup>3</sup>, мега (М) = 10<sup>6</sup>, гига (Г) = 10<sup>9</sup>'],
   ['Скорость','1 м/с = 3,6 км/ч',`Из км/ч в м/с делим на 3,6. Например, 72 км/ч = 20 м/с.`],
   ['Объём и масса','1 л = 10<sup>−3</sup> м<sup>3</sup>; 1 см<sup>3</sup> = 10<sup>−6</sup> м<sup>3</sup>; 1 т = 10<sup>3</sup> кг; 1 г = 10<sup>−3</sup> кг'],
   ['Энергия и давление','1 кВт·ч = 3,6·10<sup>6</sup> Дж; 1 атм ≈ 10<sup>5</sup> Па; 1 мм рт. ст. ≈ 133 Па'],
   ['Температура','T (К) = t (°C) + 273','В формулах газов и термодинамики температура всегда в кельвинах.']]},
  {t:'Математика, без которой не обойтись',rows:[
   ['Теорема Пифагора','c<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup>'],
   ['Тригонометрия',`sin α = ${fr('противолежащий катет','гипотенуза')}; cos α = ${fr('прилежащий катет','гипотенуза')}; tg α = ${fr('sin α','cos α')}`],
   ['Тождества','sin<sup>2</sup>α + cos<sup>2</sup>α = 1; sin 2α = 2 sin α cos α'],
   ['Табличные значения','sin 30° = 1/2; cos 30° = sin 60° = √3/2; sin 45° = cos 45° = √2/2; sin 90° = 1; sin 0° = 0'],
   ['Квадратное уравнение',`ax<sup>2</sup> + bx + c = 0, x = ${fr('−b ± '+rt('b<sup>2</sup> − 4ac'),'2a')}`],
   ['Проекции вектора',`a<sub>x</sub> = a cos α, a<sub>y</sub> = a sin α, |a| = ${rt('a<sub>x</sub><sup>2</sup> + a<sub>y</sub><sup>2</sup>')}`,'Проекция положительна, если вектор направлен по оси, и отрицательна, если против.'],
   ['Пропорции и степени','Доля: x = p·y; отношение: x/y = a/b; (ab)<sup>n</sup> = a<sup>n</sup>b<sup>n</sup>; a<sup>n</sup>·a<sup>m</sup> = a<sup>n+m</sup>; 10<sup>a</sup>·10<sup>b</sup> = 10<sup>a+b</sup>']]}],
 tips:['Алгоритм решения задачи',['Прочитай и выпиши «Дано». Переведи всё в СИ.','Сделай рисунок: оси, векторы, начальное и конечное состояние.','Определи, какой закон описывает ситуацию, и запиши его в общем виде.','Выведи ответ <b>буквами</b>, подставь числа только в самом конце.','Проверь единицы измерения и здравый смысл ответа (скорость автомобиля 5·10⁶ м/с — ошибка).']],
 vid:[['Курс «Физика с нуля» (13 видео: СИ, размерности, оформление задач)','https://quant.study/online/phys/start']]},

{id:'kin',t:'Кинематика',
 theory:[
  '<b>Механическое движение</b> — изменение положения тела относительно другого тела (системы отсчёта) с течением времени. Система отсчёта = тело отсчёта + система координат + часы.',
  '<b>Траектория</b> — линия движения. <b>Путь</b> l — длина траектории (скаляр, только растёт). <b>Перемещение</b> Δr — вектор из начальной точки в конечную.',
  '<b>Скорость</b> показывает, как быстро меняется положение. <b>Ускорение</b> показывает, как быстро меняется скорость. Если скорость и ускорение сонаправлены, тело разгоняется. Если направлены противоположно, тормозит.',
  'Равноускоренное движение: a = const. Свободное падение — частный случай с a = g. Любое движение в поле тяжести (бросок) раскладывается на горизонтальное равномерное и вертикальное равноускоренное.',
  'При движении по окружности с постоянной по модулю скоростью ускорение всё равно есть: оно направлено к центру и меняет направление скорости.'],
 groups:[
  {t:'Основные понятия',rows:[

{id:'dyn',t:'Динамика',
 theory:[
  '<b>1-й закон Ньютона:</b> существуют инерциальные системы отсчёта (ИСО), в которых тело, на которое не действуют силы или действие сил компенсировано, сохраняет скорость (в том числе покой).',
  '<b>2-й закон:</b> ускорение тела пропорционально равнодействующей силе и обратно пропорционально массе, направлено вдоль силы.',
  '<b>3-й закон:</b> тела действуют друг на друга силами, равными по модулю и противоположными по направлению. Силы приложены к <b>разным</b> телам, поэтому не уравновешивают друг друга. Это силы одной природы.',
  'Масса — мера инертности. Сила — мера действия одного тела на другое; единица 1 Н = 1 кг·м/с². Силы складываются как векторы.',
  'Главная идея динамики: нарисовать <b>все</b> силы на тело, выбрать оси, записать второй закон в проекциях и решить систему.'],

    ['Ускорение, масса и сила',`a = ${fr('F','m')}; m = ${fr('F','a')}; F = ma`,'Из второго закона: при той же силе большая масса даёт меньшее ускорение.'],
   ['Импульсная форма',`${V('F')} = ${fr('Δ'+V('p'),'Δt')}`,'Сила равна скорости изменения импульса p = mv.'],

    ['Два бруска, F приложена ко второму',`a = ${fr('F','m<sub>1</sub> + m<sub>2</sub>')}; T = m<sub>1</sub> a = ${fr('m<sub>1</sub> F','m<sub>1</sub> + m<sub>2</sub>')}`,'Трения нет. Нить тянет первый брусок, поэтому T = m<sub>1</sub>a: в числителе масса того, что тянут нитью.'],

  {t:'Движение по окружности под действием сил',rows:[

   ['Выпуклый мост (верх)',`mg − N = ${fr('m v<sup>2</sup>','R')}, N = m(g − ${fr('v<sup>2</sup>','R')})`,'Если v² = gR, N = 0 (невесомость).'],
   ['Вогнутый мост (низ)',`N − mg = ${fr('m v<sup>2</sup>','R')}, N = m(g + ${fr('v<sup>2</sup>','R')})`],
   ['Поворот на горизонтальной дороге',`F<sub>тр</sub> = ${fr('m v<sup>2</sup>','R')} ≤ μ m g; v<sub>max</sub> = ${rt('μ g R')}`],
   ['Конический маятник',`tg α = ${fr('v<sup>2</sup>','g R')} = ${fr('ω<sup>2</sup> R','g')}`,'α — угол нити с вертикалью, R — радиус окружности. Из T cos α = mg и T sin α = mv²/R.'],
   ['Верхняя точка «мёртвой петли»',`v<sub>min</sub> = ${rt('g R')}`,'Условие: N ≥ 0. В верхней точке mg + N = mv²/R.']]},
  {t:'Тяготение и спутники',rows:[

 tips:['Алгоритм для задачи по динамике',['Нарисуй тело и <b>все</b> силы на него: тяжесть, реакция, трение, натяжение, внешняя.','Выбери оси: одну вдоль ускорения (или движения), другую перпендикулярно.','Запиши 2-й закон в проекциях. Если тел несколько, для каждого отдельно.','Добавь связи: F_тр = μN, равенство ускорений при нити.','Решай систему буквами.']],
 vid:[['Рекомендовано учителем к теме «связанные тела» (YouTube, youtu.be/YkN_dFvKC7g)','https://youtu.be/YkN_dFvKC7g'],['РЭШ: Физика 10 класс, урок «Законы динамики Ньютона»','https://resh.edu.ru/subject/lesson/4717/start/270738/']]},

{id:'cons',t:'Законы сохранения в механике',
 theory:[
  '<b>Импульс</b> p = mv — вектор. <b>Импульс силы</b> FΔt равен изменению импульса тела. <b>Замкнутая система</b> — тела взаимодействуют только друг с другом. Её суммарный импульс сохраняется (векторно).',
  'Закон сохранения импульса часто применим и для незамкнутой системы: в проекции на ось, вдоль которой внешние силы не действуют, или при очень коротком взаимодействии (взрыв, удар).',
  '<b>Работа силы</b> зависит от угла между силой и перемещением. Работа силы тяжести и упругости не зависит от формы пути. Работа трения всегда отрицательна и зависит от пути.',
  '<b>Энергия</b>: кинетическая (движение) и потенциальная (взаимное положение). Механическая энергия сохраняется, если нет сил трения и сопротивления.',
  'Если есть трение, убыль механической энергии равна работе силы трения, то есть выделившемуся теплу.'],
 groups:[
  {t:'Импульс',rows:[
   ['Импульс тела',`${V('p')} = m${V('v')}`,'Единица: кг·м/с. Направлен как скорость.'],
   ['Импульс силы и закон изменения',`${V('F')}Δt = Δ${V('p')} = m${V('v')} − m${V('v')}<sub>0</sub>`,'Для удара о стенку с отскоком с той же скоростью Δp = 2mv.'],
   ['Закон сохранения импульса',`m<sub>1</sub>${V('v')}<sub>1</sub> + m<sub>2</sub>${V('v')}<sub>2</sub> = m<sub>1</sub>${V('v')}<sub>1</sub>′ + m<sub>2</sub>${V('v')}<sub>2</sub>′`,'Пиши в проекциях на ось, следя за знаками.'],
   ['Абсолютно неупругий удар (слипаются)',`v′ = ${fr('m<sub>1</sub>v<sub>1</sub> + m<sub>2</sub>v<sub>2</sub>','m<sub>1</sub> + m<sub>2</sub>')}`,'Скорости в проекциях со знаками.'],
   ['Потеря энергии при неупругом ударе',`Q = ${fr('m<sub>1</sub>m<sub>2</sub>(v<sub>1</sub> − v<sub>2</sub>)<sup>2</sup>','2(m<sub>1</sub> + m<sub>2</sub>)')}`,'Равна убыли кинетической энергии и переходит в тепло.'],
   ['Абсолютно упругий центральный удар',`v<sub>1</sub>′ = ${fr('(m<sub>1</sub> − m<sub>2</sub>)v<sub>1</sub> + 2m<sub>2</sub>v<sub>2</sub>','m<sub>1</sub> + m<sub>2</sub>')}; v<sub>2</sub>′ = ${fr('(m<sub>2</sub> − m<sub>1</sub>)v<sub>2</sub> + 2m<sub>1</sub>v<sub>1</sub>','m<sub>1</sub> + m<sub>2</sub>')}`,'Сохраняются и импульс, и кинетическая энергия. Для равных масс шары обмениваются скоростями.'],
   ['Реактивное движение, отдача','0 = M v + m u  ⇒  v = −m u / M','Скорость отдачи из покоя. u — скорость выброшенной массы m, M — оставшейся.']]},
  {t:'Работа и мощность',rows:[
   ['Работа постоянной силы','A = F s cos α','α — угол между силой и перемещением. Единица: Дж = Н·м. При α = 90° работа равна нулю.'],
   ['Работа силы тяжести','A = mg (h<sub>1</sub> − h<sub>2</sub>) = −ΔE<sub>п</sub>','Положительна, когда тело опускается.'],
   ['Работа силы упругости',`A = ${fr('k x<sub>1</sub><sup>2</sup>','2')} − ${fr('k x<sub>2</sub><sup>2</sup>','2')}`],
   ['Работа трения скольжения','A<sub>тр</sub> = −F<sub>тр</sub> s','Отрицательна. s — путь по поверхности.'],
   ['Работа по графику F(s)','A = площадь под графиком','Для силы упругости это площадь треугольника kx²/2.'],
   ['Мощность средняя',`N = ${fr('A','t')}`,'Единица: Вт = Дж/с. 1 л.с. ≈ 735 Вт.'],
   ['Мощность мгновенная','N = F v cos α','При равномерном движении N = F v.'],
   ['КПД',`η = ${fr('A<sub>полезная</sub>','A<sub>затраченная</sub>')} · 100%`,'Всегда меньше 100%.']]},
  {t:'Энергия',rows:[
   ['Кинетическая энергия',`E<sub>к</sub> = ${fr('m v<sup>2</sup>','2')} = ${fr('p<sup>2</sup>','2m')}`,'Скаляр, всегда ≥ 0.'],
   ['Потенциальная энергия тяжести','E<sub>п</sub> = m g h','h отсчитывается от выбранного нулевого уровня.'],
   ['Потенциальная энергия пружины',`E<sub>п</sub> = ${fr('k x<sup>2</sup>','2')}`,'x — деформация.'],
   ['Теорема о кинетической энергии',`A<sub>всех сил</sub> = E<sub>к2</sub> − E<sub>к1</sub> = ${fr('m v<sub>2</sub><sup>2</sup>','2')} − ${fr('m v<sub>1</sub><sup>2</sup>','2')}`,'Работа равнодействующей равна изменению кинетической энергии.'],
   ['Закон сохранения механической энергии','E<sub>к1</sub> + E<sub>п1</sub> = E<sub>к2</sub> + E<sub>п2</sub>','Если нет трения и сопротивления.'],
   ['С учётом трения','E<sub>1</sub> = E<sub>2</sub> + F<sub>тр</sub> s','Или E₂ − E₁ = A<sub>тр</sub>. Потерянная энергия стала теплом Q = F_тр s.'],
   ['Связь импульса и энергии',`p = ${rt('2m E<sub>к</sub>')}`]]}],
 tips:['Что выбрать: импульс или энергия?',['Столкновения, взрывы, выстрелы: сначала импульс.','Движение по высоте, пружины: энергия.','Неупругий удар: импульс сохраняется, энергия нет.','Нужна скорость, а время не нужно: энергия проще динамики.']],
 vid:[['Школа OnLine, канал «Физика» (есть уроки 10 класса)','https://www.youtube.com/@mektep_online_fizika'],['ИнтернетУрок: законы сохранения (базовый и профильный курс)','https://interneturok.ru/subject/physics/class/10']]},

{id:'stat',t:'Статика и гидростатика',
 theory:[
  '<b>Статика</b> изучает равновесие тел. Твёрдое тело в равновесии, если равны нулю и сумма сил, и сумма моментов сил относительно любой оси.',
  '<b>Момент силы</b> M = F·d. Плечо d — кратчайшее расстояние от оси вращения до линии действия силы. Моменты, вращающие по часовой стрелке, считаем с одним знаком, против — с другим.',
  '<b>Центр тяжести</b> — точка приложения силы тяжести. Равновесие бывает устойчивым (после отклонения возвращается), неустойчивым (уходит дальше) и безразличным.',
  '<b>Гидростатика</b>: давление жидкости на глубине h не зависит от формы сосуда. Давление передаётся в жидкости во все стороны одинаково (закон Паскаля).'],
 groups:[
  {t:'Равновесие твёрдого тела',rows:[
   ['Первое условие',`${V('F')}<sub>1</sub> + ${V('F')}<sub>2</sub> + … = 0`,'В проекциях: ΣF_x = 0, ΣF_y = 0.'],
   ['Момент силы','M = F d','Единица: Н·м.'],
   ['Второе условие (правило моментов)','ΣM<sub>по часовой</sub> = ΣM<sub>против часовой</sub>','Ось выбирай там, где приложена неизвестная сила: её момент будет равен нулю.'],
   ['Рычаг',`F<sub>1</sub> d<sub>1</sub> = F<sub>2</sub> d<sub>2</sub>`,'Выигрыш в силе — проигрыш в пути («золотое правило механики»).'],
   ['Центр тяжести системы точек',`x<sub>c</sub> = ${fr('m<sub>1</sub>x<sub>1</sub> + m<sub>2</sub>x<sub>2</sub> + …','m<sub>1</sub> + m<sub>2</sub> + …')}`,'То же для y. Однородный стержень: центр в середине.'],
   ['Подвижный и неподвижный блок','подвижный: F = P/2; неподвижный: F = P','Подвижный блок даёт выигрыш в силе в 2 раза и проигрыш в пути в 2 раза. Неподвижный лишь меняет направление силы.']]},
  {t:'Давление и гидростатика',rows:[
   ['Давление',`p = ${fr('F','S')}`,'Единица: Па = Н/м². F — сила, перпендикулярная поверхности.'],
   ['Плотность',`ρ = ${fr('m','V')}`,'Вода: 1000 кг/м³.'],
   ['Давление жидкости на глубине h','p = ρ g h','Полное давление: p = p<sub>0</sub> + ρgh, где p₀ — давление над жидкостью (атмосферное).'],
   ['Закон Паскаля. Гидравлический пресс',`${fr('F<sub>1</sub>','S<sub>1</sub>')} = ${fr('F<sub>2</sub>','S<sub>2</sub>')}`,'Выигрыш в силе равен отношению площадей поршней.'],
   ['Сообщающиеся сосуды','ρ<sub>1</sub> h<sub>1</sub> = ρ<sub>2</sub> h<sub>2</sub>','Для одной жидкости уровни одинаковы. Для двух несмешивающихся — высоты обратно пропорциональны плотностям.'],
   ['Сила Архимеда','F<sub>A</sub> = ρ<sub>ж</sub> g V<sub>погр</sub>','V погр — объём погружённой части. Направлена вверх.'],
   ['Условия плавания','F<sub>A</sub> &lt; mg — тонет; F<sub>A</sub> = mg — плавает; F<sub>A</sub> &gt; mg — всплывает','Плавает, если ρ тела ≤ ρ жидкости. Доля погружения V_погр/V = ρ_тела/ρ_ж.'],
   ['Атмосферное давление','p<sub>атм</sub> = 101 325 Па ≈ 760 мм рт. ст.','При подъёме на 12 м давление падает примерно на 1 мм рт. ст.']]}],
 tips:['Как решать задачи на равновесие',['Нарисуй все силы с точками приложения.','Запиши ΣF = 0 в проекциях.','Выбери ось и запиши ΣM = 0. Ось ставь в точку, где несколько неизвестных сил.','Для стержня: сила тяжести приложена к середине (если однородный).']],
 vid:[['Видеоуроки по теме смотри в плейлистах на вкладке «Видео»','#video']]},

{id:'mkt',t:'Молекулярно-кинетическая теория',
 theory:[
  '<b>Основные положения МКТ:</b> 1) вещество состоит из частиц (молекул, атомов); 2) частицы непрерывно и хаотично движутся; 3) частицы взаимодействуют: притягиваются и отталкиваются.',
  'Доказательства: <b>диффузия</b> (самопроизвольное перемешивание) и <b>броуновское движение</b> (хаотичное движение взвешенных частиц под ударами молекул). Температура — мера средней кинетической энергии теплового движения молекул.',
  '<b>Идеальный газ</b> — модель: молекулы — материальные точки, взаимодействуют только при столкновениях. Давление газа — результат ударов молекул о стенки.',
  '<b>Изопроцессы</b> — процессы при постоянной массе газа и одном постоянном параметре: изотермический (T), изобарный (p), изохорный (V). Температуру в законах брать только в кельвинах.',
  '<b>Насыщенный пар</b> находится в динамическом равновесии с жидкостью. Его давление зависит только от температуры. <b>Кипение</b> начинается, когда давление насыщенного пара равно внешнему давлению.'],
 groups:[
  {t:'Количество вещества и размеры',rows:[
   ['Количество вещества',`ν = ${fr('N','N<sub>A</sub>')} = ${fr('m','M')}`,'Единица: моль. N_A = 6,02·10²³ моль⁻¹.'],
   ['Молярная масса','M = M<sub>r</sub> · 10<sup>−3</sup> кг/моль','M_r — относительная молекулярная масса (по таблице Менделеева). Для воды M = 0,018 кг/моль.'],
   ['Масса одной молекулы',`m<sub>0</sub> = ${fr('M','N<sub>A</sub>')} = ${fr('m','N')}`],
   ['Число молекул',`N = ν N<sub>A</sub> = ${fr('m','M')} N<sub>A</sub>`],
   ['Концентрация и плотность',`n = ${fr('N','V')}; ρ = m<sub>0</sub> n`,'n — число молекул в единице объёма (м⁻³).']]},
  {t:'Основное уравнение МКТ и температура',rows:[
   ['Основное уравнение МКТ',`p = ${fr('1','3')} m<sub>0</sub> n <span style="text-decoration:overline">v<sup>2</sup></span>`,'Черта — среднее. Чем больше скорость и концентрация, тем выше давление.'],
   ['Через энергию',`p = ${fr('2','3')} n <span style="text-decoration:overline">E<sub>к</sub></span>`],
   ['Энергия и температура',`<span style="text-decoration:overline">E<sub>к</sub></span> = ${fr('3','2')} k T`,'k = 1,38·10⁻²³ Дж/К — постоянная Больцмана. Не зависит от рода газа.'],
   ['Давление и температура','p = n k T'],
   ['Средняя квадратичная скорость',`v<sub>кв</sub> = ${rt(fr('3kT','m<sub>0</sub>'))} = ${rt(fr('3RT','M'))}`,'R = k·N_A = 8,31 Дж/(моль·К).'],
   ['Шкалы температуры','T = t + 273; ΔT = Δt','Абсолютный нуль: T = 0 К = −273 °C.']]},
  {t:'Уравнение состояния идеального газа',rows:[
   ['Менделеева — Клапейрона',`p V = ${fr('m','M')} R T = ν R T`,'Связывает p, V, T, m. Единицы СИ: Па, м³, К, кг.'],
   ['Клапейрона (m = const)',`${fr('p V','T')} = const; ${fr('p<sub>1</sub>V<sub>1</sub>','T<sub>1</sub>')} = ${fr('p<sub>2</sub>V<sub>2</sub>','T<sub>2</sub>')}`,'Объединённый газовый закон.'],
   ['Плотность газа',`ρ = ${fr('p M','R T')}`],
   ['Закон Дальтона','p = p<sub>1</sub> + p<sub>2</sub> + …','Давление смеси газов — сумма парциальных давлений.'],
   ['Нормальные условия','p = 101 325 Па, T = 273 К, V<sub>m</sub> = 22,4 л/моль','Объём одного моля любого идеального газа.']]},
  {t:'Изопроцессы',rows:[
   ['Изотермический (T = const)','p<sub>1</sub>V<sub>1</sub> = p<sub>2</sub>V<sub>2</sub> (Бойль — Мариотт)','В координатах p–V — гипербола (изотерма).'],
   ['Изобарный (p = const)',`${fr('V<sub>1</sub>','T<sub>1</sub>')} = ${fr('V<sub>2</sub>','T<sub>2</sub>')} (Гей-Люссак)`,'В V–T — прямая, продолжение проходит через начало координат.'],
   ['Изохорный (V = const)',`${fr('p<sub>1</sub>','T<sub>1</sub>')} = ${fr('p<sub>2</sub>','T<sub>2</sub>')} (Шарль)`,'В p–T — прямая, продолжение проходит через начало координат.'],
   ['Чтение графиков','Из p–V в V–T или p–T переходи через pV/T = const.','В осях p–T и V–T прямая через начало = изохора/изобара. Гипербола в p–V = изотерма. Чем дальше от осей гипербола, тем выше T.']]},
  {t:'Насыщенный пар и влажность',rows:[
   ['Относительная влажность',`φ = ${fr('p','p<sub>н</sub>')} · 100% = ${fr('ρ','ρ<sub>н</sub>')} · 100%`,'p — парциальное давление водяного пара, p_н — давление насыщенного пара при этой температуре.'],
   ['Точка росы','Температура, при которой пар становится насыщенным (φ = 100%).','Ниже неё выпадает роса.'],
   ['Кипение','p<sub>н</sub>(t<sub>кип</sub>) = p<sub>внеш</sub>','Вода кипит при 100 °C при 101 325 Па; в горах при меньшем давлении кипит ниже.']]},
  {t:'Поверхностное натяжение и капилляры',rows:[
   ['Сила поверхностного натяжения','F = σ l','σ — коэффициент (Н/м), l — длина границы поверхности. Вода: σ ≈ 0,072 Н/м.'],
   ['Давление под сферической поверхностью',`Δp = ${fr('2σ','R')}`,'Для мыльного пузыря (две поверхности) Δp = 4σ/R.'],
   ['Высота подъёма в капилляре',`h = ${fr('2σ cos θ','ρ g r')}`,'При полном смачивании cos θ = 1. Чем уже трубка, тем выше подъём.']]},

 tips:['Алгоритм для задач на газы',['Выпиши состояния 1 и 2: p, V, T, m.','Переведи T в кельвины, p в паскали (или оставь одинаковыми единицами в отношениях).','Определи, какой параметр постоянен, и выбери закон.','Если масса меняется (утечка, откачка), применяй уравнение Менделеева — Клапейрона для каждого состояния.']],

{id:'thermo',t:'Основы термодинамики',
 theory:[
  '<b>Внутренняя энергия</b> — сумма кинетической энергии хаотичного движения частиц и потенциальной энергии их взаимодействия. У идеального газа потенциальной части нет, поэтому U зависит только от температуры.',
  'Внутреннюю энергию меняют двумя способами: <b>работой</b> и <b>теплопередачей</b> (теплопроводность, конвекция, излучение). Количество теплоты — это энергия, переданная при теплообмене.',
  '<b>Первый закон термодинамики</b> — закон сохранения энергии для тепловых процессов: полученная теплота идёт на изменение внутренней энергии и на работу газа.',
  '<b>Второй закон</b>: теплота самопроизвольно переходит только от горячего тела к холодному. Невозможна машина, полностью превращающая теплоту в работу. Максимальный КПД даёт цикл Карно.'],
 groups:[
  {t:'Внутренняя энергия и работа газа',rows:[
   ['Внутренняя энергия идеального газа',`U = ${fr('i','2')} ν R T = ${fr('i','2')} p V`,'i = 3 для одноатомного, 5 для двухатомного. Одноатомный: U = 3νRT/2.'],
   ['Изменение внутренней энергии',`ΔU = ${fr('i','2')} ν R ΔT`,'Зависит только от ΔT, в любом процессе.'],
   ['Работа газа при p = const','A = p ΔV = p (V<sub>2</sub> − V<sub>1</sub>)','Расширение: A > 0. Сжатие: A < 0.'],
   ['Работа газа по графику p–V','A = площадь под графиком','Для замкнутого цикла работа равна площади цикла (по часовой стрелке положительна).'],
   ['Работа внешних сил','A′ = −A','Работа, совершённая над газом.']]},
  {t:'Первый закон термодинамики',rows:[
   ['Формулировка','Q = ΔU + A','Q — теплота, полученная газом, A — работа газа.'],
   ['Через работу над газом','ΔU = A′ + Q','A′ — работа внешних сил над газом.'],
   ['Изохорный (V = const)','A = 0; Q = ΔU = (i/2) ν R ΔT','Всё тепло идёт на нагрев.'],
   ['Изобарный (p = const)','Q = ΔU + p ΔV = ((i + 2)/2) ν R ΔT','Одноатомный: Q = 5νRΔT/2. Работа A = νRΔT.'],
   ['Изотермический (T = const)','ΔU = 0; Q = A','Всё тепло превращается в работу.'],
   ['Адиабатный (Q = 0)','A = −ΔU','Расширение: газ охлаждается. Сжатие: нагревается. Уравнение p V<sup>γ</sup> = const, γ = (i + 2)/i (для одноатомного 5/3).']]},
  {t:'Количество теплоты и теплоёмкость',rows:[
   ['Нагревание и охлаждение','Q = c m (t<sub>2</sub> − t<sub>1</sub>)','c — удельная теплоёмкость Дж/(кг·К). Вода: 4200.'],
   ['Теплоёмкость тела','C = c m','Единица: Дж/К.'],
   ['Плавление и кристаллизация','Q = λ m','λ — удельная теплота плавления. Лёд: 3,3·10⁵ Дж/кг. Температура во время плавления постоянна.'],
   ['Парообразование и конденсация','Q = L m','L — удельная теплота парообразования. Вода: 2,3·10⁶ Дж/кг.'],
   ['Сгорание топлива','Q = q m','q — удельная теплота сгорания.'],
   ['Уравнение теплового баланса','Q<sub>отдано</sub> = Q<sub>получено</sub>','Или ΣQ = 0, если считать Q со знаком. Не забывай стадии плавления и испарения.'],
   ['Молярные теплоёмкости газа','C<sub>V</sub> = (i/2) R; C<sub>p</sub> = C<sub>V</sub> + R','Q = ν C ΔT. Соотношение Майера: C_p − C_V = R.']]},
  {t:'Тепловые двигатели',rows:[
   ['КПД теплового двигателя',`η = ${fr('A','Q<sub>1</sub>')} = ${fr('Q<sub>1</sub> − Q<sub>2</sub>','Q<sub>1</sub>')}`,'Q₁ — теплота от нагревателя, Q₂ — отданная холодильнику, A = Q₁ − Q₂.'],
   ['КПД цикла Карно (максимальный)',`η<sub>max</sub> = ${fr('T<sub>1</sub> − T<sub>2</sub>','T<sub>1</sub>')} = 1 − ${fr('T<sub>2</sub>','T<sub>1</sub>')}`,'T₁ — нагревателя, T₂ — холодильника, в кельвинах. Любой реальный КПД меньше.'],
   ['Холодильная машина',`ε = ${fr('Q<sub>2</sub>','A')}`,'Q₂ — теплота, отнятая у холодного тела.']]}],
 tips:['Как не запутаться в знаках',['Q > 0: газ получил тепло. A > 0: газ расширяется.','ΔU считай только через ΔT (любой процесс).','Для работы газа ищи площадь под графиком p–V.','В цикле ΔU = 0 за цикл, значит Q<sub>цикла</sub> = A<sub>цикла</sub>.']],
 vid:[['Внутренняя энергия идеального газа. Работа газа (YouTube, на украинском)','https://www.youtube.com/watch?v=rAq7ymPxj_E'],['Начало термодинамики (YouTube, на украинском)','https://www.youtube.com/watch?v=fo2HE2tu_3I'],['Первый закон для изопроцессов. Адиабатный процесс (YouTube, на украинском)','https://www.youtube.com/watch?v=u3XIZEb-IcA']]},

{id:'es',t:'Электростатика',
 theory:[
  '<b>Электрический заряд</b> бывает двух знаков. Одноимённые заряды отталкиваются, разноимённые притягиваются. Заряд дискретен: q = N·e. Закон сохранения заряда: в замкнутой системе суммарный заряд постоянен.',
  '<b>Электрическое поле</b> — особая форма материи, через которую взаимодействуют заряды. Напряжённость E — силовая характеристика поля (вектор). Потенциал φ — энергетическая характеристика (скаляр).',
  'Силовые линии начинаются на положительных зарядах и заканчиваются на отрицательных. Чем гуще линии, тем сильнее поле. Поле плоского конденсатора внутри однородно.',
  '<b>Проводник</b> в электростатическом поле: внутри E = 0, весь проводник эквипотенциален, заряд распределён по поверхности. <b>Диэлектрик</b> ослабляет поле в ε раз.',
  '<b>Конденсатор</b> накапливает заряд и энергию. Электроёмкость зависит от геометрии и диэлектрика, а не от заряда и напряжения.'],
 groups:[
  {t:'Заряд и закон Кулона',rows:[
   ['Квантование заряда','q = N e','e = 1,6·10⁻¹⁹ Кл — элементарный заряд.'],
   ['Закон сохранения заряда','q<sub>1</sub> + q<sub>2</sub> + … = const','При соприкосновении одинаковых шариков заряд делится поровну: q′ = (q₁ + q₂)/2.'],
   ['Закон Кулона',`F = k ${fr('|q<sub>1</sub>||q<sub>2</sub>|','ε r<sup>2</sup>')}`,'k = 9·10⁹ Н·м²/Кл² = 1/(4πε₀), ε₀ = 8,85·10⁻¹² Ф/м. В вакууме ε = 1. Только для точечных зарядов.']]},
  {t:'Электрическое поле',rows:[
   ['Напряжённость',`${V('E')} = ${fr(V('F'),'q')}`,'Единица: В/м = Н/Кл. Направление: на положительный заряд — по силе, на отрицательный — против.'],
   ['Сила в поле',`${V('F')} = q ${V('E')}`],
   ['Поле точечного заряда',`E = k ${fr('|q|','ε r<sup>2</sup>')}`,'От положительного — наружу, к отрицательному — внутрь.'],
   ['Принцип суперпозиции',`${V('E')} = ${V('E')}<sub>1</sub> + ${V('E')}<sub>2</sub> + …`,'Векторная сумма. Для двух зарядов на одной прямой складываем или вычитаем модули.'],
   ['Поле заряженной сферы','вне: E = k Q/r²; внутри: E = 0','Проводящая сфера. Вне сферы поле как у точечного заряда в центре.'],
   ['Однородное поле',`E = ${fr('U','d')} = ${fr('σ','ε<sub>0</sub> ε')}`,'Плоский конденсатор, σ — поверхностная плотность заряда.']]},
  {t:'Потенциал и энергия',rows:[
   ['Потенциал',`φ = ${fr('W<sub>п</sub>','q')}`,'Единица: В. Скаляр, складывается алгебраически.'],
   ['Потенциал точечного заряда',`φ = k ${fr('q','ε r')}`,'Со знаком заряда.'],
   ['Работа поля','A = q (φ<sub>1</sub> − φ<sub>2</sub>) = q U = −ΔW<sub>п</sub>','Не зависит от формы пути. U = φ₁ − φ₂ — напряжение.'],
   ['Потенциальная энергия заряда в поле','W<sub>п</sub> = q φ','Для двух точечных зарядов: W_п = k q₁q₂/(ε r).'],
   ['Связь E и U (однородное поле)','U = E d','d — расстояние вдоль силовой линии.'],
   ['Энергия поля','w = ε<sub>0</sub> ε E<sup>2</sup> / 2','Объёмная плотность энергии, Дж/м³.']]},
  {t:'Диэлектрики и проводники',rows:[
   ['Диэлектрическая проницаемость',`ε = ${fr('E<sub>0</sub>','E')}`,'Показывает, во сколько раз диэлектрик ослабляет поле. Вода ≈ 81, воздух ≈ 1.'],
   ['Проводник в поле','E<sub>внутри</sub> = 0; φ = const по всему проводнику','Заряды собираются на поверхности, сильнее у острий.']]},
  {t:'Конденсаторы',rows:[
   ['Электроёмкость',`C = ${fr('q','U')}`,'Единица: Ф. 1 мкФ = 10⁻⁶ Ф, 1 пФ = 10⁻¹² Ф.'],
   ['Плоский конденсатор',`C = ${fr('ε<sub>0</sub> ε S','d')}`,'Больше площадь и ε, меньше расстояние d — больше ёмкость.'],
   ['Энергия конденсатора',`W = ${fr('q<sup>2</sup>','2C')} = ${fr('C U<sup>2</sup>','2')} = ${fr('q U','2')}`,'Подключён к источнику (U = const) или отключён (q = const): выбирай формулу, где постоянна одна величина.'],
   ['Параллельное соединение','C = C<sub>1</sub> + C<sub>2</sub> + …; U одинаково; q = q<sub>1</sub> + q<sub>2</sub> + …'],
   ['Последовательное соединение',`${fr('1','C')} = ${fr('1','C<sub>1</sub>')} + ${fr('1','C<sub>2</sub>')} + …; q одинаков; U = U<sub>1</sub> + U<sub>2</sub> + …`,'Два: C = C₁C₂/(C₁ + C₂).'],
   ['Изменение конденсатора','отключён (q = const): U ∝ 1/C, E не меняется при раздвигании пластин. Подключён (U = const): q ∝ C.','Вставили диэлектрик: C растёт в ε раз.']]},
  {t:'Движение заряда в поле',rows:[
   ['Ускорение заряда',`a = ${fr('q E','m')}`,'Однородное поле: движение равноускоренное, как с силой тяжести.'],
   ['Разгон из покоя в поле',`q U = ${fr('m v<sup>2</sup>','2')}  ⇒  v = ${rt(fr('2 q U','m'))}`,'Работа поля идёт на кинетическую энергию. Электрон: m = 9,1·10⁻³¹ кг.'],
   ['Влёт в плоский конденсатор перпендикулярно полю','x = v<sub>0</sub> t; y = a t<sup>2</sup>/2','Как горизонтальный бросок с ускорением a = qE/m.']]}],
 tips:['На что смотреть в задачах',['Если нужно векторное поле, раскладывай на оси и складывай векторно.','Потенциалы складываются как числа, с учётом знака зарядов.','Нужна скорость заряда: энергия (qU = Δmv²/2) обычно проще.','Следи, подключён ли конденсатор к источнику или отключён.']],
 vid:[['РЭШ: Электрический заряд. Закон Кулона (урок 26)','https://resh.edu.ru/subject/lesson/6293/start/160282/'],['Школа OnLine: закон сохранения энергии в электростатике, 10 класс','https://www.youtube.com/@mektep_online_fizika']]},

{id:'dc',t:'Постоянный электрический ток',
 theory:[
  '<b>Электрический ток</b> — направленное движение заряженных частиц. В металлах носители — свободные электроны. За направление тока принято движение положительных зарядов (от «+» источника к «−» во внешней цепи).',
  '<b>Сила тока</b> — заряд, проходящий через сечение проводника за единицу времени. <b>Напряжение</b> — работа поля по перемещению единичного заряда. <b>Сопротивление</b> зависит от материала, длины и сечения проводника.',
  '<b>ЭДС</b> источника — работа сторонних сил по перемещению единичного заряда внутри источника. У источника есть внутреннее сопротивление r, поэтому напряжение на его клеммах меньше ЭДС при токе в цепи.',
  'Работа тока идёт на нагрев проводников (закон Джоуля — Ленца) и на механическую или химическую работу.'],
 groups:[
  {t:'Основные величины и закон Ома',rows:[
   ['Сила тока',`I = ${fr('q','t')}`,'Единица: А. 1 А = 1 Кл/с.'],
   ['Через скорость носителей','I = q<sub>0</sub> n v S','n — концентрация носителей, v — скорость упорядоченного движения, S — сечение.'],
   ['Закон Ома для участка цепи',`I = ${fr('U','R')}`,'Единица R: Ом = В/А.'],
   ['Сопротивление проводника',`R = ρ ${fr('l','S')}`,'ρ — удельное сопротивление (Ом·м). Если провод растянули в 2 раза без потери объёма, R растёт в 4 раза.'],
   ['Зависимость от температуры','ρ = ρ<sub>0</sub>(1 + α Δt)','У металлов сопротивление растёт с температурой.']]},
  {t:'Соединения проводников',rows:[
   ['Последовательное','I одинаков; U = U<sub>1</sub> + U<sub>2</sub>; R = R<sub>1</sub> + R<sub>2</sub>','U₁/U₂ = R₁/R₂. Напряжение делится пропорционально сопротивлению.'],
   ['Параллельное',`U одинаково; I = I<sub>1</sub> + I<sub>2</sub>; ${fr('1','R')} = ${fr('1','R<sub>1</sub>')} + ${fr('1','R<sub>2</sub>')}`,'I₁/I₂ = R₂/R₁. Общее сопротивление меньше наименьшего.'],
   ['Два резистора параллельно',`R = ${fr('R<sub>1</sub>R<sub>2</sub>','R<sub>1</sub> + R<sub>2</sub>')}`],
   ['n одинаковых резисторов','последовательно: nR; параллельно: R/n'],
   ['Смешанные цепи','Разбивай схему на последовательные и параллельные участки, считай изнутри наружу.','Узлы с одинаковым потенциалом можно стянуть в точку; провод без сопротивления закорачивает участок.']]},
  {t:'Работа и мощность тока',rows:[
   ['Работа тока','A = I U t = I<sup>2</sup> R t = (U<sup>2</sup>/R) t','Единица: Дж. 1 кВт·ч = 3,6·10⁶ Дж.'],
   ['Мощность','P = I U = I<sup>2</sup> R = U<sup>2</sup>/R','Единица: Вт. Последовательно удобно P = I²R, параллельно P = U²/R.'],
   ['Закон Джоуля — Ленца','Q = I<sup>2</sup> R t','Для чисто нагревательной нагрузки Q = A.']]},
  {t:'ЭДС и закон Ома для полной цепи',rows:[
   ['ЭДС',`ℰ = ${fr('A<sub>ст</sub>','q')}`,'Единица: В.'],
   ['Закон Ома для полной цепи',`I = ${fr('ℰ','R + r')}`,'R — внешнее сопротивление, r — внутреннее сопротивление источника.'],
   ['Напряжение на клеммах','U = ℰ − I r = I R','При разомкнутой цепи U = ℰ.'],
   ['Ток короткого замыкания',`I<sub>кз</sub> = ${fr('ℰ','r')}`,'R = 0. Опасен: источник греется.'],
   ['КПД источника',`η = ${fr('U','ℰ')} = ${fr('R','R + r')}`],
   ['Мощность на нагрузке',`P = I<sup>2</sup>R = ${fr('ℰ<sup>2</sup> R','(R + r)<sup>2</sup>')}; P<sub>max</sub> = ${fr('ℰ<sup>2</sup>','4r')} при R = r`,'При максимальной мощности КПД всего 50%.'],
   ['Батареи элементов','последовательно n: ℰ = nℰ₀, r = nr₀; параллельно n: ℰ = ℰ₀, r = r₀/n']]},
  {t:'Измерения и токи в средах',rows:[

const T2={
kin:['<b>Знак проекции — главная ловушка.</b> Выбери ось, затем каждую векторную величину (v₀, a, g) записывай с учётом знака. При броске вверх с осью вверх a = −g.','<b>Графики.</b> Наклон графика x(t) — скорость, наклон графика v(t) — ускорение, площадь под графиком v(t) — перемещение (путь — площадь под |v|). Это любимая тема ЕГЭ.','<b>Свободное падение.</b> Без сопротивления воздуха все тела падают с одним ускорением g независимо от массы. Время подъёма до остановки t = v₀/g, дальше падение симметрично.','<b>Окружность.</b> aц = v²/R = ω²R = 4π²R/T²; v = ωR = 2πR/T. У точек одного вращающегося тела ω одинакова, а линейная скорость больше там, где больше R.'],
dyn:['<b>Три закона Ньютона.</b> 1-й: в ИСО тело, на которое силы не действуют или скомпенсированы, движется равномерно прямолинейно или покоится. 2-й: ma = ΣF (векторная сумма). 3-й: силы взаимодействия равны по модулю, противоположны по направлению, одной природы, приложены к <b>разным</b> телам и потому не компенсируются.','<b>Алгоритм:</b> рисунок, все силы (тяжесть, реакция, трение, натяжение, упругость), ось вдоль ускорения, проекции, уравнения. Трение скольжения Fтр = μN; трение покоя 0 ≤ Fтр ≤ μN.','<b>Вес</b> — сила, с которой тело действует на опору или подвес (приложена к опоре). В лифте с ускорением вверх P = m(g + a) — перегрузка; при a = g вниз вес равен нулю — невесомость.','<b>Тяготение.</b> F = Gm₁m₂/r²; на поверхности g = GM/R², на высоте h: g = GM/(R + h)². Первая космическая скорость v₁ = √(gR) ≈ 7,9 км/с — скорость круговой орбиты у поверхности.'],
cons:['<b>Импульс</b> p = mv — вектор. В замкнутой системе (или при очень коротком взаимодействии, или по проекции, где внешних сил нет) суммарный импульс сохраняется. Неупругий удар: m₁v₁ + m₂v₂ = (m₁ + m₂)u, часть энергии переходит во внутреннюю.','<b>Теоремы.</b> Импульс силы равен изменению импульса: FΔt = Δp. Работа равнодействующей равна изменению кинетической энергии: A = ΔEк.','<b>Энергия.</b> Eк = mv²/2; Eп = mgh (тяжесть), Eп = kx²/2 (пружина). Без трения Eк + Eп = const; с трением Eк₁ + Eп₁ = Eк₂ + Eп₂ + Q, где Q = Fтр·s.','<b>Мощность</b> N = A/t = Fv·cos α. КПД η = Aполезн/Aзатр · 100% всегда меньше 100%.'],
stat:['<b>Равновесие</b> тела с осью вращения требует двух условий: ΣF = 0 и сумма моментов относительно любой оси равна нулю (по часовой = против часовой). Момент M = F·d, где d — плечо.','<b>Давление и Архимед.</b> p = F/S; в жидкости p = p₀ + ρgh (закон Паскаля передаёт внешнее давление). Сила Архимеда FA = ρж·g·Vпогр. Тело плавает, если FA = mg; средняя плотность плавающего тела меньше плотности жидкости.','<b>Центр тяжести</b> — точка приложения силы тяжести; у однородного симметричного тела совпадает с центром симметрии.'],
mkt:['<b>Основные положения МКТ:</b> вещество состоит из частиц; частицы беспорядочно движутся (броуновское движение, диффузия); частицы взаимодействуют (притягиваются и отталкиваются).','<b>Идеальный газ</b> — модель: размерами молекул и их взаимодействием на расстоянии пренебрегаем, удары упругие. Основное уравнение: p = (1/3)m₀nv²кв = (2/3)nĒк; средняя энергия Ēк = (3/2)kT. Температура — мера средней кинетической энергии молекул.','<b>Уравнение состояния:</b> pV = νRT; при m = const: pV/T = const. Изопроцессы: T = const — pV = const (Бойль–Мариотт); p = const — V/T = const (Гей-Люссак); V = const — p/T = const (Шарль). Температуру в газовых законах берём в кельвинах.','<b>Влажность.</b> Насыщенный пар находится в динамическом равновесии с жидкостью, его давление зависит только от температуры. φ = p/pн · 100% = ρ/ρн · 100%.'],
thermo:['<b>Внутренняя энергия</b> идеального одноатомного газа U = (3/2)νRT = (3/2)pV зависит только от температуры. Изменить её можно работой или теплопередачей.','<b>Первый закон:</b> Q = ΔU + A, где A — работа газа. Изохорный: A = 0; изобарный: A = pΔV; изотермический: ΔU = 0, Q = A; адиабатный: Q = 0, A = −ΔU. Q > 0 — газ получает тепло, A > 0 — газ расширяется.','<b>Работа газа</b> равна площади под графиком p(V), за цикл — площади внутри цикла. КПД двигателя η = (Q₁ − Q₂)/Q₁ = A/Q₁. Максимальный КПД (цикл Карно) η = (T₁ − T₂)/T₁, T₁ — нагреватель, T₂ — холодильник.','<b>Тепловой баланс:</b> Qотдано = Qполучено. Нагрев Q = cmΔt, плавление Q = λm, кипение Q = Lm, сгорание Q = qm. Во время фазового перехода температура не меняется.'],
es:['<b>Заряд</b> сохраняется в замкнутой системе и квантован: q = Ne, e = 1,6·10⁻¹⁹ Кл. При контакте одинаковых проводящих шариков заряд делится поровну.','<b>Закон Кулона:</b> F = k|q₁q₂|/(εr²); одноимённые заряды отталкиваются. Напряжённость E = F/q — силовая характеристика поля; для точечного заряда E = k|q|/(εr²). Принцип суперпозиции: поля складываются как векторы.','<b>Потенциал</b> φ = W/q — энергетическая характеристика. Работа поля A = q(φ₁ − φ₂) = qU. В однородном поле U = Ed.','<b>Конденсатор:</b> C = q/U = ε₀εS/d; энергия W = CU²/2 = q²/(2C). Отключён от источника — q = const; подключён — U = const. Этот приём часто нужен в ЕГЭ.'],
dc:['<b>Ток</b> — упорядоченное движение заряженных частиц, I = q/t. За направление тока принято направление движения положительных зарядов.','<b>Закон Ома для участка:</b> I = U/R; R = ρl/S. Последовательно: I одинаков, U складываются, R = R₁ + R₂. Параллельно: U одинаково, токи складываются, 1/R = 1/R₁ + 1/R₂.','<b>ЭДС</b> ℰ = Aст/q — работа сторонних сил по перемещению единичного заряда. Закон Ома для полной цепи I = ℰ/(R + r); напряжение на зажимах U = ℰ − Ir; ток короткого замыкания Iкз = ℰ/r.','<b>Джоуль–Ленц:</b> Q = I²Rt; мощность P = UI = I²R = U²/R. Мощность на внешней нагрузке максимальна при R = r.']
};

function legend(ch,html){
 const tx=html.replace(/<sub>[^<]*<\/sub>/g,'').replace(/<[^>]+>/g,'').replace(/sin|cos|tg|ln|const|max|min|ср|общ/g,' ');
 if(/[А-Яа-я]{4,}/.test(tx)||tx.length>90)return '';
 const seen=[];(tx.match(/[A-Za-zα-ωℰΔ]/g)||[]).forEach(s=>{if(!seen.includes(s))seen.push(s)});
 const g=GL[ch]||{},it=[];
 seen.forEach(s=>{if(s==='Δ')it.push('<span><i>Δ</i> — изменение величины (конечное − начальное)</span>');else if(g[s]&&it.length<8)it.push(`<span><i>${s}</i> — ${g[s][1]}${g[s][2]&&g[s][2]!=='—'?', '+g[s][2]:''}</span>`)});
 if(/<sub>/.test(html))it.push('<span class="ix">Индекс внизу уточняет величину: 0 — начальное значение, 1, 2 — номер тела или состояния.</span>');
 return it.length?`<div class="lg"><b>Где:</b> ${it.join('')}</div>`:'';
}

<script type="text/plain" data-legacy>
/* ---------- theory ---------- */
const $=s=>document.querySelector(s);
function rowHTML(ch,r){return `<div class="row"><div class="nm">${r[0]}</div><div class="fm">${r[1]}</div>${legend(ch,r[1])}${r[2]?`<div class="nt"><b>Важно:</b> ${r[2]}</div>`:''}</div>`}
function chapterHTML(c,i){
 const basic=c.groups.filter(g=>!g.adv),adv=c.groups.filter(g=>g.adv);
 const n=basic.reduce((a,g)=>a+g.rows.length,0),na=adv.reduce((a,g)=>a+g.rows.length,0);
 let h=`<summary><span class="no">${i+1}</span><span class="ttl">${c.t}<span class="cnt">${n} основных формул${na?' + '+na+' дополнительных':''}</span></span><span class="chev"></span></summary><div class="body">`;
 h+=`<div class="seg"><button type="button" class="sg on" data-pane="theory">Теория</button>${Q[c.id]?'<button type="button" class="sg" data-pane="quant">Величины</button>':''}<button type="button" class="sg" data-pane="formulas">Формулы <small>${n}</small></button></div>`;
 h+='<div class="pane" data-p="theory"><ul class="pts">'+c.theory.map(x=>`<li>${x}</li>`).join('')+'</ul>';
 if(T2[c.id])h+='<h3 class="sub">Разбор законов</h3><ul class="pts">'+T2[c.id].map(x=>`<li>${x}</li>`).join('')+'</ul>';
 h+=(DG[c.id]||[]).map(k=>`<figure class="dg">${FIG[k][0]}<figcaption>${FIG[k][1]}</figcaption></figure>`).join('');
 if(c.tips){h+=`<div class="tip"><b>${c.tips[0]}</b><ul>${c.tips[1].map(x=>`<li>${x}</li>`).join('')}</ul></div>`}
 h+='</div>';
 if(Q[c.id])h+='<div class="pane" data-p="quant" hidden><p class="note">Каждая буква в формулах — физическая величина. Здесь её название, единица в СИ и смысл.</p>'+Q[c.id].map(r=>`<div class="qrow"><div class="qs">${r[0]}</div><div><b>${r[1]}</b>${r[2]?` <span class="qu">${r[2]}</span>`:''}${r[3]?`<div class="note">${r[3]}</div>`:''}</div></div>`).join('')+'</div>';
 h+='<div class="pane" data-p="formulas" hidden>';
 basic.forEach(g=>{h+=`<div class="grp-wrap"><h4 class="grp">${g.t}</h4>`+g.rows.map(r=>rowHTML(c.id,r)).join('')+'</div>'});
 if(na){h+=`<details class="adv"><summary>Дополнительные формулы (${na}): для сложных задач и углублённого уровня</summary><p class="note">В базовом курсе их знать не обязательно, но они встречаются во второй части ЕГЭ и в олимпиадных задачах.</p>`;
  adv.forEach(g=>{h+=`<div class="grp-wrap"><h4 class="grp">${g.t.replace('Дополнительные формулы: ','')}</h4>`+g.rows.map(r=>rowHTML(c.id,r)).join('')+'</div>'});h+='</details>'}
 h+='</div>';
 if(c.vid&&c.vid.length){
  h+='<h3 class="sub">Видео по теме</h3><ul class="vids">'+c.vid.map(v=>v[1]==='#video'?`<li><a href="#video" data-go="video">${v[0]}</a></li>`:`<li><a href="${v[1]}" target="_blank" rel="noopener">${v[0]}</a></li>`).join('')+'</ul>';
 }
 h+=`<label class="mark"><input type="checkbox" data-done="${c.id}"> Глава изучена, задачи решены</label></div>`;
 return h;
}
function renderTheory(){
 const box=$('#chapters');
 box.innerHTML='';
 S.forEach((c,i)=>{
  const d=document.createElement('details');d.className='ch';d.id='ch-'+c.id;d.dataset.id=c.id;d.innerHTML=chapterHTML(c,i);box.appendChild(d);
 });
 $('#chips').innerHTML=S.map((c,i)=>`<button class="chip" data-jump="${c.id}">${i+1}. ${c.t.split(':')[0]}</button>`).join('');
 sync();
}
function sync(){
 S.forEach(c=>{
  const d=$('#ch-'+c.id),ok=done.includes(c.id);
  d.classList.toggle('isdone',ok);
  d.querySelector('[data-done]').checked=ok;
  document.querySelector(`[data-jump="${c.id}"]`).classList.toggle('done',ok);
 });
 const p=done.length,t=S.length;
 $('#pbar').style.width=(p/t*100)+'%';
 $('#ptxt').textContent=p+' из '+t+' глав';
}
document.addEventListener('change',e=>{
 const id=e.target.dataset&&e.target.dataset.done;
 if(id){done=e.target.checked?[...new Set([...done,id])]:done.filter(x=>x!==id);store.set('fiz10_done',done);sync()}
 const w=e.target.dataset&&e.target.dataset.week;
 if(w!==undefined&&w!==''){const k=String(w);wdone=e.target.checked?[...new Set([...wdone,k])]:wdone.filter(x=>x!==k);store.set('fiz10_plan',wdone);e.target.closest('.week').classList.toggle('isdone',e.target.checked)}
});
document.addEventListener('click',e=>{
 const j=e.target.closest('[data-jump]');
 if(j){const d=$('#ch-'+j.dataset.jump);$('#q').value='';filter('');d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'})}
 const g=e.target.closest('[data-go]');
 if(g){e.preventDefault();showTab(g.dataset.go)}
});
function filter(q){
 q=q.trim().toLowerCase();let any=false;
 document.querySelectorAll('details.ch').forEach(d=>{
  let hit=false;
  d.querySelectorAll('.grp-wrap').forEach(gw=>{
   let gh=false;
   gw.querySelectorAll('.row').forEach(r=>{const m=!q||r.textContent.toLowerCase().includes(q);r.hidden=!m;if(m)gh=true});
   gw.hidden=!gh;if(gh)hit=true;
  });
  const titleHit=!q||d.querySelector('.ttl').textContent.toLowerCase().includes(q);
  d.hidden=!(hit||titleHit);
  if(q&&hit)d.open=true;
  if(q)d.querySelectorAll('details.adv').forEach(x=>{x.open=!!x.querySelector('.row:not([hidden])')});
  if(!d.hidden)any=true;
 });
 $('#none').hidden=any;
}
$('#q').addEventListener('input',e=>filter(e.target.value));


</script>
