const EGE=[{"n": 1, "topic": "Механика: кинематика", "fmt": "Ответ — число", "pts": 1, "lvl": "Б", "items": [["Автомобиль, начав движение из состояния покоя, разгоняется с постоянным ускорением 2 м/с². Какой путь (в м) он пройдёт за первые 6 с?", "36", "Из покоя s = at²/2 = 2·6²/2 = 36 м."], ["Мяч бросили с земли вертикально вверх, и он поднялся на максимальную высоту 20 м. Какова начальная скорость мяча (в м/с)? Сопротивлением воздуха пренебречь.", "20", "В верхней точке v = 0, поэтому H = v₀²/(2g), откуда v₀ = √(2gH) = √(2·10·20) = 20 м/с."], ["Координата тела меняется по закону x = 4 − 3t + t² (все величины в СИ). Через какое время после начала отсчёта тело остановится (в с)?", "1,5", "Сравниваем с x = x₀ + v₀ₓt + aₓt²/2: v₀ₓ = −3 м/с, aₓ = 2 м/с².<br>vₓ = −3 + 2t = 0 → t = 1,5 с."]]}, {"n": 2, "topic": "Механика: динамика", "fmt": "Ответ — число", "pts": 1, "lvl": "Б", "items": [["Брусок массой 2 кг движется по горизонтальному столу под действием горизонтальной силы 12 Н с ускорением 2 м/с². Чему равна сила трения, действующая на брусок (в Н)?", "8", "2-й закон Ньютона вдоль движения: F − F<sub>тр</sub> = ma, откуда F<sub>тр</sub> = 12 − 2·2 = 8 Н."], ["Груз массой 0,5 кг неподвижно висит на пружине жёсткостью 100 Н/м. Каково удлинение пружины (в см)?", "5", "Равновесие: kx = mg → x = mg/k = 0,5·10/100 = 0,05 м = 5 см."], ["Спутник движется по круговой орбите на высоте, равной радиусу Земли R. Во сколько раз сила тяжести, действующая на спутник на орбите, меньше, чем у поверхности Земли?", "4", "F = GMm/r². Расстояние до центра Земли r = R + R = 2R, поэтому сила уменьшается в 2² = 4 раза."]]}, {"n": 3, "topic": "Механика: законы сохранения", "fmt": "Ответ — число", "pts": 1, "lvl": "Б", "items": [["Шарик массой 0,2 кг падает без начальной скорости с высоты 5 м. Какова его кинетическая энергия в момент удара о землю (в Дж)? Сопротивлением воздуха пренебречь.", "10", "Закон сохранения энергии: E<sub>к</sub> = mgh = 0,2·10·5 = 10 Дж."], ["Вагон массой 20 т движется со скоростью 0,5 м/с и сцепляется с неподвижным вагоном массой 30 т. С какой скоростью (в м/с) движется сцепка?", "0,2", "Закон сохранения импульса: m₁v = (m₁ + m₂)u.<br>u = 20·0,5/50 = 0,2 м/с."], ["Кран равномерно поднимает груз массой 500 кг на высоту 12 м за 20 с. Какова мощность крана (в Вт)?", "3000", "A = mgh = 500·10·12 = 60 000 Дж.<br>N = A/t = 60 000/20 = 3000 Вт."]]}, {"n": 4, "topic": "Механика: статика, колебания и волны", "fmt": "Ответ — число", "pts": 1, "lvl": "Б", "items": [["Невесомый рычаг находится в равновесии. К левому плечу длиной 20 см приложена сила 30 Н. Какую силу (в Н) нужно приложить к правому плечу длиной 60 см?", "10", "Правило моментов: F₁d₁ = F₂d₂ → F₂ = 30·20/60 = 10 Н."], ["Длину нити математического маятника увеличили в 4 раза. Во сколько раз увеличился период малых колебаний?", "2", "T = 2π√(l/g) ∝ √l. При l → 4l период растёт в √4 = 2 раза."], ["Звуковая волна частотой 500 Гц распространяется в воде со скоростью 1500 м/с. Какова длина волны (в м)?", "3", "λ = v/ν = 1500/500 = 3 м."]]}, {"n": 5, "topic": "Механика: анализ процессов", "fmt": "Два верных утверждения из пяти", "pts": 2, "lvl": "П", "items": [["Тело брошено под углом к горизонту, сопротивлением воздуха можно пренебречь. Выберите два верных утверждения. В ответе запишите две цифры в порядке возрастания.<br>1) В высшей точке траектории скорость тела равна нулю.<br>2) В высшей точке траектории ускорение тела равно нулю.<br>3) Горизонтальная составляющая скорости тела не меняется в течение всего полёта.<br>4) Время подъёма до высшей точки равно времени спуска до уровня броска.<br>5) Полная механическая энергия тела увеличивается при подъёме.", "34", "1) Неверно: в высшей точке остаётся горизонтальная составляющая v₀cos α.<br>2) Неверно: ускорение всюду равно g.<br>3) Верно: по горизонтали сил нет, a<sub>x</sub> = 0.<br>4) Верно: движение по вертикали симметрично.<br>5) Неверно: без сопротивления полная энергия сохраняется."], ["Брусок скользит вниз по шероховатой наклонной плоскости с постоянной скоростью. Выберите два верных утверждения. В ответе запишите две цифры в порядке возрастания.<br>1) Равнодействующая всех сил, действующих на брусок, равна нулю.<br>2) Сила трения скольжения направлена вниз вдоль плоскости.<br>3) Модуль силы трения равен модулю проекции силы тяжести на плоскость.<br>4) Механическая энергия бруска сохраняется.<br>5) Сила реакции опоры по модулю равна силе тяжести.", "13", "Скорость постоянна, значит a = 0.<br>1) Верно (1-й закон Ньютона).<br>2) Неверно: трение направлено против скольжения, то есть вверх вдоль плоскости.<br>3) Верно: вдоль плоскости F<sub>тр</sub> = mg sin α.<br>4) Неверно: энергия уходит на нагревание (трение).<br>5) Неверно: N = mg cos α &lt; mg."], ["Однородный шар плавает в воде, погрузившись ровно наполовину. Выберите два верных утверждения. В ответе запишите две цифры в порядке возрастания.<br>1) Плотность материала шара больше плотности воды.<br>2) Сила Архимеда, действующая на шар, равна силе тяжести.<br>3) Если шар перенести в керосин, погружённая часть объёма уменьшится.<br>4) Давление воды на нижнюю точку шара не зависит от глубины погружения.<br>5) Плотность материала шара равна половине плотности воды.", "25", "1) Неверно: тело плавает, значит его плотность меньше плотности воды.<br>2) Верно: плавание при равновесии, F<sub>A</sub> = mg.<br>3) Неверно: плотность керосина меньше, поэтому шар погрузится глубже.<br>4) Неверно: p = ρgh растёт с глубиной.<br>5) Верно: ρ<sub>в</sub>g(V/2) = ρgV → ρ = ρ<sub>в</sub>/2."]]}, {"n": 6, "topic": "Механика: изменение величин, соответствие", "fmt": "Две цифры (изменение величин или соответствие)", "pts": 2, "lvl": "Б", "items": [["Мяч бросили вертикально вверх. Как меняются при его подъёме до верхней точки физические величины? Сопротивлением воздуха пренебречь. Для каждой величины определите характер изменения: 1) увеличивается 2) уменьшается 3) не изменяется.<br>А) модуль импульса мяча<br>Б) полная механическая энергия мяча", "23", "А) Скорость уменьшается, поэтому p = mv уменьшается → 2.<br>Б) Нет сопротивления, энергия сохраняется → 3."], ["Искусственный спутник переходит с одной круговой орбиты на другую, более высокую. Как меняются при этом его скорость и период обращения? Для каждой величины определите характер изменения: 1) увеличивается 2) уменьшается 3) не изменяется.<br>А) скорость движения по орбите<br>Б) период обращения", "21", "v = √(GM/r) уменьшается с ростом радиуса орбиты: А → 2.<br>T = 2πr/v растёт (и r растёт, и v падает): Б → 1."], ["Тело бросили с поверхности земли вертикально вверх со скоростью v₀. Установите соответствие между физическими величинами и формулами (g — ускорение свободного падения).<br>А) время полёта до возвращения в точку броска<br>Б) максимальная высота подъёма<br>1) v₀/g  2) v₀²/(2g)  3) 2v₀/g  4) v₀²/g", "32", "Подъём длится v₀/g, спуск столько же, поэтому время полёта 2v₀/g: А → 3.<br>H = v₀²/(2g): Б → 2."]]}, {"n": 7, "topic": "МКТ: уравнение состояния, тепловое равновесие", "fmt": "Ответ — число", "pts": 1, "lvl": "Б", "items": [["Во сколько раз увеличится давление идеального газа, если концентрацию молекул увеличить в 3 раза, а температуру оставить прежней?", "3", "p = nkT: при неизменной T давление пропорционально n, значит растёт в 3 раза."], ["Идеальный газ в закрытом сосуде нагрели от 27 °C до 327 °C. Во сколько раз увеличилось его давление?", "2", "Изохорный процесс: p/T = const. T₁ = 300 К, T₂ = 600 К, давление выросло в 600/300 = 2 раза. Температуру берём в кельвинах."], ["Сколько молей газа находится в сосуде объёмом 8,31 л при давлении 100 кПа и температуре 100 К? (R = 8,31 Дж/(моль·К))", "1", "pV = νRT → ν = pV/(RT) = 10⁵·8,31·10⁻³/(8,31·100) = 1 моль."]]}, {"n": 8, "topic": "МКТ и термодинамика: тепловые явления", "fmt": "Ответ — число", "pts": 1, "lvl": "Б", "items": [["Какое количество теплоты (в кДж) необходимо для нагревания 2 кг воды на 10 °C? Удельная теплоёмкость воды 4200 Дж/(кг·°C).", "84", "Q = cmΔT = 4200·2·10 = 84 000 Дж = 84 кДж."], ["Газ получил от нагревателя 300 Дж теплоты и совершил работу 120 Дж. Как изменилась внутренняя энергия газа (в Дж)?", "180", "Первый закон термодинамики: Q = ΔU + A → ΔU = 300 − 120 = 180 Дж (энергия выросла)."], ["Температура нагревателя идеальной тепловой машины 500 К, температура холодильника 300 К. Каков КПД машины (в %)?", "40", "η = 1 − T<sub>х</sub>/T<sub>н</sub> = 1 − 300/500 = 0,4 = 40 %."]]}, {"n": 9, "topic": "МКТ и термодинамика: анализ процессов", "fmt": "Два верных утверждения из пяти", "pts": 2, "lvl": "П", "items": [["Идеальный газ в сосуде с подвижным поршнем медленно нагревают при постоянном давлении. Выберите два верных утверждения. В ответе запишите две цифры в порядке возрастания.<br>1) Объём газа увеличивается.<br>2) Концентрация молекул газа увеличивается.<br>3) Газ совершает положительную работу.<br>4) Внутренняя энергия газа уменьшается.<br>5) Газ отдаёт теплоту окружающим телам.", "13", "Изобарный процесс: V/T = const, при росте T объём растёт.<br>1) Верно. 2) Неверно: n = N/V уменьшается.<br>3) Верно: A = pΔV &gt; 0.<br>4) Неверно: U ∝ T растёт. 5) Неверно: газ получает теплоту."], ["Кристаллическое вещество плавится, получая теплоту от нагревателя постоянной мощности. Выберите два верных утверждения. В ответе запишите две цифры в порядке возрастания.<br>1) Подводимая теплота идёт на увеличение средней кинетической энергии молекул.<br>2) Температура вещества во время плавления не меняется.<br>3) Удельная теплота плавления зависит от мощности нагревателя.<br>4) Вещество при плавлении отдаёт теплоту.<br>5) Внутренняя энергия вещества увеличивается.", "25", "1) Неверно: температура постоянна, растёт потенциальная энергия взаимодействия частиц.<br>2) Верно. 3) Неверно: λ — свойство вещества.<br>4) Неверно: вещество получает теплоту. 5) Верно."], ["Идеальный газ в теплоизолированном цилиндре быстро сжимают поршнем (процесс считать адиабатным). Выберите два верных утверждения. В ответе запишите две цифры в порядке возрастания.<br>1) Температура газа уменьшается.<br>2) Внутренняя энергия газа увеличивается.<br>3) Газ совершает положительную работу.<br>4) Газ не получает и не отдаёт теплоту.<br>5) Объём газа увеличивается.", "24", "Адиабата: Q = 0, A<sub>газа</sub> &lt; 0 (сжатие), ΔU = −A<sub>газа</sub> &gt; 0.<br>Поэтому верны 2) и 4). Температура растёт (1 неверно), объём уменьшается (5 неверно), работа газа отрицательна (3 неверно)."]]}, {"n": 10, "topic": "МКТ и термодинамика: изменение величин, соответствие", "fmt": "Две цифры (изменение величин или соответствие)", "pts": 2, "lvl": "Б", "items": [["Идеальный газ в сосуде постоянного объёма охлаждают. Как меняются при этом давление газа и средняя кинетическая энергия теплового движения его молекул? Определите характер изменения: 1) увеличивается 2) уменьшается 3) не изменяется.<br>А) давление газа<br>Б) средняя кинетическая энергия молекул", "22", "Изохорный процесс: p ∝ T, температура падает, значит давление уменьшается: А → 2.<br>Ē<sub>к</sub> = 3kT/2 тоже уменьшается: Б → 2."], ["Установите соответствие между процессом в идеальном газе постоянной массы и законом, который его описывает.<br>А) изотермический<br>Б) изохорный<br>1) p/T = const  2) pV = const  3) V/T = const  4) pT = const", "21", "Изотермический: T = const → pV = const (закон Бойля — Мариотта): А → 2.<br>Изохорный: V = const → p/T = const (закон Шарля): Б → 1."], ["Идеальный газ изотермически сжимают. Как меняются при этом давление газа и его внутренняя энергия? Определите характер изменения: 1) увеличивается 2) уменьшается 3) не изменяется.<br>А) давление газа<br>Б) внутренняя энергия газа", "13", "pV = const, объём падает, давление растёт: А → 1.<br>U ∝ T, а T = const, внутренняя энергия не меняется: Б → 3."]]}, {"n": 11, "topic": "Электродинамика: электрическое поле, постоянный ток", "fmt": "Ответ — число", "pts": 1, "lvl": "Б", "items": [["Два точечных заряда 2 нКл и 3 нКл находятся в вакууме на расстоянии 3 см. С какой силой они взаимодействуют (в мкН)? k = 9·10⁹ Н·м²/Кл².", "60", "F = kq₁q₂/r² = 9·10⁹·2·10⁻⁹·3·10⁻⁹/(3·10⁻²)² = 6·10⁻⁵ Н = 60 мкН."], ["Через резистор сопротивлением 20 Ом течёт ток 0,5 А. Какая мощность (в Вт) выделяется на резисторе?", "5", "P = I²R = 0,5²·20 = 5 Вт."], ["Два резистора с сопротивлениями 6 Ом и 3 Ом соединены параллельно и подключены к источнику напряжением 12 В. Какова общая сила тока в цепи (в А)?", "6", "R = 6·3/(6 + 3) = 2 Ом. I = U/R = 12/2 = 6 А.<br>(Проверка: 12/6 + 12/3 = 2 + 4 = 6 А.)"]]}, {"n": 12, "topic": "Электродинамика: магнитное поле, электромагнитная индукция", "fmt": "Ответ — число", "pts": 1, "lvl": "Б", "items": [["Прямой проводник длиной 0,5 м с током 4 А находится в однородном магнитном поле с индукцией 0,1 Тл и расположен перпендикулярно линиям индукции. Чему равна сила Ампера (в Н)?", "0,2", "F = BIl sin α = 0,1·4·0,5·1 = 0,2 Н."], ["Магнитный поток через контур равномерно возрастает от 0,02 Вб до 0,08 Вб за 0,3 с. Чему равна ЭДС индукции в контуре (в В)?", "0,2", "|ℰ| = ΔΦ/Δt = (0,08 − 0,02)/0,3 = 0,2 В."], ["Катушка индуктивностью 0,4 Гн, по которой течёт ток 5 А, создаёт магнитное поле. Чему равна энергия этого поля (в Дж)?", "5", "W = LI²/2 = 0,4·25/2 = 5 Дж."]]}, {"n": 13, "topic": "Электродинамика: электромагнитные колебания и волны, оптика", "fmt": "Ответ — число", "pts": 1, "lvl": "Б", "items": [["Ёмкость конденсатора в идеальном колебательном контуре увеличили в 4 раза. Во сколько раз увеличился период свободных колебаний?", "2", "T = 2π√(LC) ∝ √C. При C → 4C период увеличивается в √4 = 2 раза."], ["Луч света падает на плоское зеркало под углом 30° к его поверхности. Каков угол (в градусах) между падающим и отражённым лучами?", "120", "Угол падения отсчитывают от перпендикуляра: 90° − 30° = 60°. Угол отражения тоже 60°, поэтому между лучами 60° + 60° = 120°."], ["Предмет находится на расстоянии 60 см от тонкой собирающей линзы с фокусным расстоянием 20 см. На каком расстоянии от линзы (в см) получится изображение?", "30", "Формула тонкой линзы: 1/F = 1/d + 1/f → 1/f = 1/20 − 1/60 = 2/60 → f = 30 см."]]}, {"n": 14, "topic": "Электродинамика: анализ процессов", "fmt": "Два верных утверждения из пяти", "pts": 2, "lvl": "П", "items": [["Заряженная частица влетает в однородное магнитное поле перпендикулярно линиям индукции. Выберите два верных утверждения. В ответе запишите две цифры в порядке возрастания.<br>1) Траектория частицы — окружность.<br>2) Сила Лоренца совершает положительную работу и увеличивает кинетическую энергию частицы.<br>3) Модуль скорости частицы не меняется.<br>4) При увеличении скорости вдвое радиус окружности уменьшится вдвое.<br>5) Сила Лоренца направлена вдоль вектора скорости.", "13", "Сила Лоренца перпендикулярна скорости, работы не совершает, модуль скорости постоянен, движение по окружности.<br>Верны 1) и 3). 2) и 5) неверны. 4) Неверно: R = mv/(qB), при удвоении v радиус удваивается."], ["Два резистора R₁ &lt; R₂ соединены последовательно и подключены к источнику постоянного напряжения. Выберите два верных утверждения. В ответе запишите две цифры в порядке возрастания.<br>1) Сила тока в R₁ больше, чем в R₂.<br>2) Напряжение на R₂ больше, чем на R₁.<br>3) Мощность, выделяющаяся в R₁, больше, чем в R₂.<br>4) Общее сопротивление равно R₁R₂/(R₁ + R₂).<br>5) Сила тока через оба резистора одинакова.", "25", "При последовательном соединении I одинакова (5 верно, 1 неверно). U = IR, значит на большем сопротивлении больше напряжение (2 верно). P = I²R, больше у R₂ (3 неверно). Формула в 4) относится к параллельному соединению."], ["Плоский воздушный конденсатор зарядили, отключили от источника, а затем медленно раздвинули пластины. Выберите два верных утверждения. В ответе запишите две цифры в порядке возрастания.<br>1) Заряд конденсатора увеличивается.<br>2) Электроёмкость конденсатора уменьшается.<br>3) Напряжение между пластинами уменьшается.<br>4) Энергия электрического поля конденсатора увеличивается.<br>5) Напряжённость поля между пластинами увеличивается.", "24", "Источник отключён, поэтому q = const. C = ε₀S/d уменьшается (2 верно). U = q/C растёт (3 неверно). W = q²/(2C) растёт (4 верно). E = σ/ε₀ = q/(ε₀S) не меняется (5 неверно)."]]}, {"n": 15, "topic": "Электродинамика: изменение величин, соответствие", "fmt": "Две цифры (изменение величин или соответствие)", "pts": 2, "lvl": "Б", "items": [["В идеальном колебательном контуре ёмкость конденсатора увеличили. Как меняются период свободных колебаний и их частота? Определите характер изменения: 1) увеличивается 2) уменьшается 3) не изменяется.<br>А) период колебаний<br>Б) частота колебаний", "12", "T = 2π√(LC) растёт: А → 1. ν = 1/T убывает: Б → 2."], ["Установите соответствие между физическими величинами и формулами для них (B — индукция поля, I — сила тока, l — длина проводника, α — угол между проводником и B, L — индуктивность, q, v — заряд и скорость частицы, Φ — магнитный поток).<br>А) сила Ампера<br>Б) энергия магнитного поля катушки<br>1) LI²/2  2) −ΔΦ/Δt  3) BIl sin α  4) qvB", "31", "Сила Ампера F = BIl sin α: А → 3.<br>Энергия магнитного поля катушки W = LI²/2: Б → 1.<br>(Формула 2) — ЭДС индукции, 4) — сила Лоренца.)"], ["К резистору подключено идеальное постоянное напряжение. Параллельно резистору подключили второй такой же резистор. Как изменятся общее сопротивление цепи и сила тока в неразветвлённой части цепи? Определите характер изменения: 1) увеличивается 2) уменьшается 3) не изменяется.<br>А) общее сопротивление цепи<br>Б) сила тока в неразветвлённой части", "21", "Два одинаковых R параллельно дают R/2, сопротивление уменьшается: А → 2.<br>При том же U ток I = U/R<sub>общ</sub> растёт (вдвое): Б → 1."]]}, {"n": 16, "topic": "Квантовая физика: ядерная физика", "fmt": "Ответ — число", "pts": 1, "lvl": "Б", "items": [["Сколько нейтронов содержится в ядре изотопа урана ²³⁵₉₂U?", "143", "Число нейтронов N = A − Z = 235 − 92 = 143."], ["Ядро ²³⁸₉₂U испытало α-распад. Каково массовое число образовавшегося ядра?", "234", "α-частица — это ядро ⁴₂He. При α-распаде массовое число уменьшается на 4: 238 − 4 = 234 (зарядовое число станет 90)."], ["Период полураспада радиоактивного изотопа равен 4 суткам. Сколько ядер из 800 останется нераспавшимися через 12 суток?", "100", "12 суток = 3 периода полураспада. N = N₀/2³ = 800/8 = 100."]]}, {"n": 17, "topic": "Квантовая физика: фотоны, фотоэффект, изменение величин", "fmt": "Две цифры (изменение величин или соответствие)", "pts": 2, "lvl": "Б", "items": [["Интенсивность монохроматического света, падающего на катод фотоэлемента, увеличили, не меняя частоты (частота выше красной границы). Как меняются сила тока насыщения и максимальная кинетическая энергия фотоэлектронов? Определите характер изменения: 1) увеличивается 2) уменьшается 3) не изменяется.<br>А) сила тока насыщения<br>Б) максимальная кинетическая энергия фотоэлектронов", "13", "Число фотонов растёт, поэтому растёт число выбитых электронов и ток насыщения: А → 1.<br>По уравнению Эйнштейна hν = A<sub>вых</sub> + E<sub>к max</sub> энергия электронов зависит только от частоты и работы выхода, поэтому не меняется: Б → 3."], ["Установите соответствие между физическими величинами и формулами (h — постоянная Планка, ν — частота, λ — длина волны, c — скорость света).<br>А) энергия фотона<br>Б) импульс фотона<br>1) hν  2) h/λ  3) hλ  4) ν/h", "12", "E = hν: А → 1. p = h/λ: Б → 2."], ["Монохроматический свет заменили светом с меньшей длиной волны. Как меняются при этом энергия фотона и его импульс? Определите характер изменения: 1) увеличивается 2) уменьшается 3) не изменяется.<br>А) энергия фотона<br>Б) импульс фотона", "11", "Меньше λ значит больше ν = c/λ, поэтому E = hν растёт: А → 1. p = h/λ тоже растёт: Б → 1."]]}, {"n": 18, "topic": "Физический смысл величин и законов (разные разделы)", "fmt": "Два верных утверждения из пяти", "pts": 2, "lvl": "Б", "items": [["Выберите два верных утверждения.<br>1) Сила Лоренца при движении заряженной частицы в магнитном поле совершает положительную работу.<br>2) Внутренняя энергия данной массы идеального газа зависит только от его температуры.<br>3) Период малых колебаний математического маятника не зависит от массы груза.<br>4) Работа силы трения скольжения всегда положительна.<br>5) Скорость радиоактивного распада зависит от температуры вещества.", "23", "2) Верно: для идеального газа U = (i/2)νRT.<br>3) Верно: T = 2π√(l/g).<br>1) Неверно: сила перпендикулярна скорости. 4) Неверно: сила трения скольжения направлена против перемещения, работа отрицательна. 5) Неверно: распад определяется внутренними свойствами ядер."], ["Выберите два верных утверждения.<br>1) Электрический ток в металлах создаётся упорядоченным движением положительных ионов.<br>2) Удельная теплоёмкость вещества численно равна количеству теплоты, необходимому для нагревания 1 кг вещества на 1 К.<br>3) При равномерном движении по окружности ускорение направлено по касательной к траектории.<br>4) Работа силы тяжести при перемещении тела по замкнутой траектории равна нулю.<br>5) Фотон обладает ненулевой массой покоя.", "24", "2) Верно — это определение удельной теплоёмкости.<br>4) Верно: сила тяжести потенциальна, работа по замкнутому пути равна нулю.<br>1) Неверно: носители тока в металлах — свободные электроны. 3) Неверно: ускорение направлено к центру. 5) Неверно: масса покоя фотона равна нулю."], ["Выберите два верных утверждения.<br>1) Собирающая линза всегда даёт действительное изображение предмета.<br>2) При неупругом ударе импульс замкнутой системы тел уменьшается.<br>3) При изотермическом расширении идеального газа его внутренняя энергия не меняется.<br>4) α-частица — это ядро атома водорода.<br>5) ЭДС индукции в контуре определяется скоростью изменения магнитного потока через контур.", "35", "3) Верно: T = const, а U зависит только от T.<br>5) Верно: закон Фарадея ℰ = −ΔΦ/Δt.<br>1) Неверно: если предмет между линзой и фокусом, изображение мнимое. 2) Неверно: импульс замкнутой системы сохраняется при любом ударе. 4) Неверно: α-частица — ядро гелия ⁴₂He."]]}, {"n": 19, "topic": "Показания приборов (с учётом погрешности)", "fmt": "Число с погрешностью", "pts": 1, "lvl": "Б", "items": [["Динамометр имеет шкалу от 0 до 5 Н. Между соседними числовыми отметками 1 Н нанесено 5 одинаковых делений. Стрелка остановилась на второй чёрточке после отметки 3 Н. Погрешность измерения равна цене деления. Запишите показание динамометра с учётом погрешности (в Н).", "(3,4 ± 0,2) Н", "Цена деления: 1 Н / 5 = 0,2 Н. Показание: 3 + 2·0,2 = 3,4 Н. Погрешность равна цене деления: 0,2 Н.<br>В бланк обычно вносят числа подряд: 3,4 и 0,2."], ["Шкала вольтметра проградуирована до 10 В. Между отметками 0, 2, 4, 6, 8, 10 В нанесено по 4 одинаковых деления. Стрелка остановилась на третьем делении после отметки 4 В. Погрешность измерения равна цене деления. Запишите показание вольтметра с учётом погрешности (в В).", "(5,5 ± 0,5) В", "Цена деления: 2 В / 4 = 0,5 В. Показание: 4 + 3·0,5 = 5,5 В. Погрешность 0,5 В."], ["Уровень воды в мензурке стоит на 3 деления выше отметки 40 мл. Между отметками 20 и 40 мл нанесено 10 делений. Погрешность измерения равна половине цены деления. Запишите объём воды с учётом погрешности (в мл).", "(46 ± 1) мл", "Цена деления: (40 − 20)/10 = 2 мл. Объём: 40 + 3·2 = 46 мл. Погрешность: 2/2 = 1 мл."]]}, {"n": 20, "topic": "Планирование эксперимента", "fmt": "Выбор двух установок", "pts": 1, "lvl": "Б", "items": [["Нужно экспериментально обнаружить зависимость периода колебаний математического маятника от длины нити. Какие две установки следует выбрать?<br>1) шарик 20 г, нить 0,5 м<br>2) шарик 20 г, нить 1 м<br>3) шарик 40 г, нить 1,5 м<br>4) шарик 60 г, нить 1 м", "12", "Нужно менять только длину, остальное держать одинаковым. Одинаковая масса шарика (20 г) только у установок 1 и 2, длина у них разная."], ["Нужно экспериментально проверить, как сопротивление проводника зависит от площади его поперечного сечения. Какие две установки следует выбрать?<br>1) алюминий, длина 1 м, сечение 2 мм²<br>2) медь, длина 1 м, сечение 1 мм²<br>3) медь, длина 2 м, сечение 2 мм²<br>4) медь, длина 1 м, сечение 2 мм²", "24", "Одинаковыми должны быть материал и длина, отличаться — только сечение. Это пара 2 и 4 (медь, 1 м; 1 мм² и 2 мм²)."], ["Нужно проверить, что сила трения скольжения не зависит от площади соприкосновения. Какие две установки следует выбрать? Во всех случаях брусок равномерно тянут по горизонтальной поверхности.<br>1) брусок 200 г, большая грань, по дереву<br>2) брусок 400 г, большая грань, по дереву<br>3) брусок 200 г, малая грань, по дереву<br>4) брусок 200 г, малая грань, по стеклу", "13", "Меняем только площадь: масса и материал поверхности одинаковы. Подходят 1 и 3 (200 г, дерево; большая и малая грани)."]]}, {"n": 21, "topic": "Часть 2. Качественная задача (электродинамика)", "fmt": "Развёрнутый ответ", "pts": 3, "lvl": "П", "items": [["Электрическая цепь состоит из источника тока с ЭДС ℰ и внутренним сопротивлением r, лампы и последовательно включённого реостата. К лампе подключён идеальный вольтметр. Ползунок реостата перемещают так, что его сопротивление уменьшается. Как меняются при этом показания вольтметра и яркость лампы? Ответ обоснуйте.", "Показания вольтметра растут, лампа горит ярче.", "<b>Явления и законы:</b> закон Ома для полной цепи, закон Ома для участка цепи, формула мощности тока.<br><b>Рассуждение.</b><br>1) Сила тока в цепи I = ℰ/(R<sub>л</sub> + R<sub>р</sub> + r). При уменьшении R<sub>р</sub> знаменатель уменьшается, ток растёт.<br>2) Вольтметр показывает напряжение на лампе U = IR<sub>л</sub>. Сопротивление лампы считаем постоянным, а I растёт, значит U растёт.<br>3) Яркость определяется мощностью P = I²R<sub>л</sub>. Она растёт вместе с током, лампа становится ярче.<br><span class=\"note\">Задание оценивается до 3 баллов: верный ответ, названные явления и законы, логичное рассуждение без пропусков.</span>"], ["Лёгкое замкнутое алюминиевое кольцо подвешено на длинной нити. К кольцу приближают северный полюс постоянного магнита (вдоль оси кольца). Как поведёт себя кольцо? Ответ обоснуйте.", "Кольцо отталкивается от магнита (отклоняется в сторону от него).", "<b>Явления и законы:</b> электромагнитная индукция (закон Фарадея), правило Ленца, действие магнитного поля на ток.<br><b>Рассуждение.</b><br>1) При приближении магнита магнитный поток через кольцо растёт, в нём возникает ЭДС индукции. Кольцо замкнуто, поэтому появляется индукционный ток.<br>2) По правилу Ленца индукционный ток направлен так, что его магнитное поле противодействует росту потока, то есть направлено навстречу полю магнита. Кольцо с таким током ведёт себя как магнит, обращённый к магниту одноимённым (северным) полюсом.<br>3) Одноимённые полюса отталкиваются, поэтому на кольцо действует сила отталкивания, и оно отклоняется от магнита.<br><span class=\"note\">Задание оценивается до 3 баллов: верный ответ, названные явления и законы, логичное рассуждение без пропусков.</span>"], ["Незаряженная лёгкая металлическая гильза подвешена на шёлковой нити. К ней, не касаясь, подносят отрицательно заряженную эбонитовую палочку. Как поведёт себя гильза? Ответ обоснуйте.", "Гильза притянется к палочке.", "<b>Явления и законы:</b> электростатическая индукция в проводнике, закон Кулона.<br><b>Рассуждение.</b><br>1) В металле есть свободные электроны. Под действием поля палочки они смещаются от неё: ближняя к палочке сторона гильзы заряжается положительно, дальняя отрицательно. Суммарный заряд гильзы остаётся нулевым.<br>2) Сила Кулона убывает с расстоянием. Притяжение ближнего (положительного) края к палочке сильнее, чем отталкивание дальнего (отрицательного) края.<br>3) Равнодействующая направлена к палочке, гильза притягивается.<br><span class=\"note\">Задание оценивается до 3 баллов: верный ответ, названные явления и законы, логичное рассуждение без пропусков.</span>"]]}, {"n": 22, "topic": "Часть 2. Расчётная задача: механика", "fmt": "Развёрнутое решение", "pts": 2, "lvl": "П", "items": [["Шайба массой 100 г скользит по горизонтальному льду с начальной скоростью 6 м/с. Коэффициент трения шайбы о лёд 0,2. Какой путь пройдёт шайба до остановки? Сопротивлением воздуха пренебречь.", "9 м", "<b>Модель:</b> шайба — материальная точка, система отсчёта связана со льдом (инерциальная), по вертикали шайба в равновесии.<br><b>Решение.</b><br>Вертикаль: N = mg. Горизонталь: ma = F<sub>тр</sub> = μN = μmg → a = μg = 2 м/с².<br>Равнозамедленное движение до остановки: s = v₀²/(2a) = 36/(2·2) = 9 м.<br>Масса сократилась, поэтому данные в 100 г не нужны."], ["Брусок массой 4 кг без трения соскальзывает из состояния покоя по наклонной плоскости с углом наклона 30°. За какое время он пройдёт 10 м?", "2 с", "<b>Модель:</b> брусок — материальная точка, трения нет, система отсчёта инерциальная.<br><b>Решение.</b><br>Вдоль плоскости: ma = mg sin α → a = g sin α = 10·0,5 = 5 м/с².<br>s = at²/2 → t = √(2s/a) = √(2·10/5) = 2 с."], ["Шарик массой 0,5 кг на лёгкой нерастяжимой нити длиной 0,8 м отпускают без начальной скорости из горизонтального положения нити. Чему равна сила натяжения нити в нижней точке траектории?", "15 Н", "<b>Модель:</b> шарик — материальная точка, сопротивлением воздуха пренебрегаем.<br><b>Решение.</b><br>Энергия (натяжение нити работы не совершает): mgL = mv²/2 → v² = 2gL.<br>В нижней точке 2-й закон Ньютона на вертикальную ось (центр сверху): T − mg = mv²/L = 2mg.<br>T = 3mg = 3·0,5·10 = 15 Н."]]}, {"n": 23, "topic": "Часть 2. Расчётная задача: МКТ и термодинамика", "fmt": "Развёрнутое решение", "pts": 2, "lvl": "П", "items": [["Два моля идеального одноатомного газа нагревают при постоянном давлении на 50 К. Какое количество теплоты получил газ? R = 8,31 Дж/(моль·К).", "≈ 2,08 кДж", "<b>Решение.</b> Первый закон термодинамики: Q = ΔU + A.<br>Одноатомный газ: ΔU = (3/2)νRΔT. Изобарный процесс: A = pΔV = νRΔT.<br>Q = (3/2 + 1)νRΔT = (5/2)νRΔT = 2,5·2·8,31·50 ≈ 2077 Дж ≈ 2,08 кДж."], ["В сосуде находится 0,4 моль идеального газа при температуре 27 °C и давлении 2·10⁵ Па. Каков объём сосуда (в литрах)? R = 8,31 Дж/(моль·К).", "≈ 5 л", "<b>Решение.</b> Уравнение Клапейрона — Менделеева: pV = νRT, T = 27 + 273 = 300 К.<br>V = νRT/p = 0,4·8,31·300/(2·10⁵) ≈ 4,99·10⁻³ м³ ≈ 5 л."], ["В калориметр с 0,5 кг воды при температуре 20 °C бросили кусок льда массой 0,1 кг при 0 °C. Какая температура установится в калориметре? Теплоёмкостью калориметра и потерями пренебречь. Удельная теплоёмкость воды 4200 Дж/(кг·°C), удельная теплота плавления льда 3,3·10⁵ Дж/кг.", "≈ 3,6 °C", "<b>Проверка:</b> чтобы расплавить лёд, нужно λm<sub>л</sub> = 3,3·10⁴ Дж. Вода, остывая до 0 °C, отдаст c·m<sub>в</sub>·20 = 4,2·10⁴ Дж, этого достаточно, поэтому лёд растает целиком.<br><b>Уравнение теплового баланса:</b> c m<sub>в</sub>(20 − t) = λ m<sub>л</sub> + c m<sub>л</sub> t.<br>42 000 − 2100t = 33 000 + 420t → 9000 = 2520t → t ≈ 3,6 °C."]]}, {"n": 24, "topic": "Часть 2. Расчётная задача высокого уровня: МКТ и термодинамика", "fmt": "Развёрнутое решение", "pts": 3, "lvl": "В", "items": [["Одноатомный идеальный газ совершает цикл 1→2→3→4→1 на диаграмме p–V: 1→2 изохорное нагревание от p₀ до 2p₀ (объём V₀); 2→3 изобарное расширение до 2V₀; 3→4 изохорное охлаждение до p₀; 4→1 изобарное сжатие до V₀. Найдите КПД цикла.", "η = 2/13 ≈ 0,15 (15 %)", "<b>Модель:</b> идеальный одноатомный газ, U = (3/2)pV. Цикл — прямоугольник.<br><b>Работа за цикл:</b> площадь прямоугольника A = (2p₀ − p₀)(2V₀ − V₀) = p₀V₀.<br><b>Теплота получена на участках 1→2 и 2→3</b> (на 3→4 и 4→1 газ охлаждается и отдаёт теплоту):<br>Q₁₂ = ΔU = (3/2)(2p₀V₀ − p₀V₀) = 1,5p₀V₀ (A = 0).<br>Q₂₃ = ΔU + A = (3/2)(4p₀V₀ − 2p₀V₀) + 2p₀V₀ = 3p₀V₀ + 2p₀V₀ = 5p₀V₀.<br>Q<sub>н</sub> = 6,5 p₀V₀.<br><b>КПД:</b> η = A/Q<sub>н</sub> = 1/6,5 = 2/13 ≈ 0,15."], ["В вертикальном цилиндре под поршнем массой 10 кг и площадью 50 см² находится идеальный газ. Поршень может свободно скользить, атмосферное давление 10⁵ Па. Высота столба газа 20 см, температура 300 К. Газ медленно нагрели до 360 К. На какую высоту поднялся поршень и какую работу совершил газ? Трением пренебречь.", "На 4 см; A = 24 Дж", "<b>Модель:</b> поршень в равновесии на каждом шаге, давление газа постоянно (изобарный процесс).<br>Давление: p = p₀ + Mg/S = 10⁵ + 100/(50·10⁻⁴) = 1,2·10⁵ Па.<br>Закон Гей-Люссака: h₂/h₁ = T₂/T₁ → h₂ = 20·360/300 = 24 см. Поршень поднялся на Δh = 4 см.<br>Работа газа: A = pSΔh = 1,2·10⁵·50·10⁻⁴·0,04 = 24 Дж."], ["В калориметр, содержащий 200 г воды при 20 °C, впускают 10 г водяного пара при 100 °C. Какая температура установится? Теплоёмкостью калориметра и потерями пренебречь. c = 4200 Дж/(кг·°C), удельная теплота парообразования воды 2,3·10⁶ Дж/кг.", "≈ 50 °C", "<b>Модель:</b> теплообмен только между водой и паром, пар конденсируется полностью (проверим по итогу: t &lt; 100 °C).<br><b>Тепловой баланс:</b> пар отдаёт L m<sub>п</sub> при конденсации и c m<sub>п</sub>(100 − t) при остывании образовавшейся воды; вода получает c m<sub>в</sub>(t − 20).<br>2,3·10⁶·0,01 + 4200·0,01·(100 − t) = 4200·0,2·(t − 20)<br>23 000 + 4200 − 42t = 840t − 16 800 → 44 000 = 882t → t ≈ 49,9 °C ≈ 50 °C.<br>Температура получилась ниже 100 °C, значит допущение верно."]]}, {"n": 25, "topic": "Часть 2. Расчётная задача высокого уровня: электродинамика", "fmt": "Развёрнутое решение", "pts": 3, "lvl": "В", "items": [["Источник тока с ЭДС 12 В и внутренним сопротивлением 1 Ом подключён к двум резисторам 3 Ом и 6 Ом, соединённым параллельно. Найдите силу тока через источник, напряжение на резисторах и мощность, выделяющуюся на резисторе 3 Ом.", "I = 4 А; U = 8 В; P ≈ 21,3 Вт", "<b>Решение.</b><br>Сопротивление внешней цепи: R = 3·6/(3 + 6) = 2 Ом.<br>Закон Ома для полной цепи: I = ℰ/(R + r) = 12/(2 + 1) = 4 А.<br>Напряжение на параллельных резисторах: U = IR = 4·2 = 8 В.<br>Мощность на резисторе 3 Ом: P = U²/R₁ = 64/3 ≈ 21,3 Вт.<br>(Проверка: токи 8/3 А и 8/6 А в сумме дают 4 А.)"], ["По двум горизонтальным рельсам, замкнутым резистором, равномерно скользит проводящая перемычка длиной 0,5 м со скоростью 2 м/с. Рельсы находятся в однородном вертикальном магнитном поле с индукцией 0,4 Тл. Полное сопротивление цепи 0,2 Ом. Найдите силу тока в цепи и силу, которую нужно приложить к перемычке для равномерного движения. Трением пренебречь.", "I = 2 А; F = 0,4 Н", "<b>Модель:</b> поле однородное, перемычка перпендикулярна линиям индукции и скорости; самоиндукцией пренебрегаем.<br>ЭДС индукции: ℰ = Blv = 0,4·0,5·2 = 0,4 В.<br>Закон Ома: I = ℰ/R = 0,4/0,2 = 2 А.<br>Сила Ампера, тормозящая перемычку: F<sub>А</sub> = BIl = 0,4·2·0,5 = 0,4 Н.<br>Скорость постоянна, значит приложенная сила уравновешивает силу Ампера: F = F<sub>А</sub> = 0,4 Н."], ["Протон движется в однородном магнитном поле с индукцией 0,2 Тл по окружности радиусом 5 см. Найдите скорость протона и период его обращения. Масса протона 1,67·10⁻²⁷ кг, заряд 1,6·10⁻¹⁹ Кл. Поле перпендикулярно скорости.", "v ≈ 9,6·10⁵ м/с; T ≈ 3,3·10⁻⁷ с", "<b>Модель:</b> на протон действует только сила Лоренца, она сообщает центростремительное ускорение, релятивистские эффекты пренебрежимо малы (v ≪ c).<br>qvB = mv²/R → v = qBR/m = 1,6·10⁻¹⁹·0,2·0,05/(1,67·10⁻²⁷) ≈ 9,6·10⁵ м/с.<br>Период: T = 2πR/v = 2πm/(qB) = 2·3,14·1,67·10⁻²⁷/(1,6·10⁻¹⁹·0,2) ≈ 3,3·10⁻⁷ с."]]}, {"n": 26, "topic": "Часть 2. Расчётная задача высокого уровня: механика с обоснованием модели", "fmt": "Развёрнутое решение с обоснованием", "pts": 4, "lvl": "В", "items": [["Пуля массой 10 г, летящая горизонтально со скоростью 400 м/с, попадает в деревянный брусок массой 1,99 кг, подвешенный на нити длиной 1 м, и застревает в нём. На какой максимальный угол от вертикали отклонится нить? Обоснуйте применимость используемых законов.", "cos α = 0,8, α ≈ 37°", "<b>Обоснование модели.</b><br>• Пуля и брусок — материальные точки, система отсчёта связана с Землёй (инерциальная).<br>• Удар кратковременный: за время удара внешние силы (тяжесть, натяжение нити, вертикальные) не успевают заметно изменить горизонтальный импульс. Поэтому импульс системы «пуля + брусок» сохраняется по горизонтали. Механическая энергия при ударе не сохраняется (неупругий удар, пуля застревает).<br>• После удара нить нерастяжима, её сила натяжения перпендикулярна скорости и работы не совершает; сопротивлением воздуха пренебрегаем, поэтому механическая энергия системы сохраняется.<br><b>Решение.</b><br>Удар: mv = (m + M)u → u = 0,01·400/2 = 2 м/с.<br>Подъём: (m + M)u²/2 = (m + M)gh → h = u²/(2g) = 4/20 = 0,2 м.<br>Геометрия: h = L(1 − cos α) → cos α = 1 − 0,2 = 0,8, α ≈ 37°."], ["Небольшая шайба соскальзывает без трения с высоты H по горке, переходящей в вертикальную петлю радиусом R = 0,4 м. При какой минимальной высоте H шайба сможет пройти верхнюю точку петли, не отрываясь от опоры? Обоснуйте применимость используемых законов.", "H = 2,5R = 1 м", "<b>Обоснование модели.</b><br>• Шайба — материальная точка, система отсчёта инерциальная, трения нет. Сила реакции опоры перпендикулярна скорости и работы не совершает, поэтому механическая энергия сохраняется.<br>• Шайба не отрывается, пока сила реакции опоры N ≥ 0. Предельный случай N = 0: тогда центростремительное ускорение сообщает одна сила тяжести.<br><b>Решение.</b><br>Верхняя точка, предельный случай: mg = mv²/R → v² = gR.<br>Энергия: mgH = mg·2R + mv²/2 = 2mgR + mgR/2 → H = 2,5R = 2,5·0,4 = 1 м."], ["Небольшой шарик массой m на нерастяжимой лёгкой нити длиной 1 м равномерно движется по окружности в горизонтальной плоскости, нить образует с вертикалью угол 60°. Найдите период обращения шарика. Обоснуйте выбор модели и применимость законов.", "T = 2π√(L cos α/g) ≈ 1,4 с", "<b>Обоснование модели.</b><br>• Шарик — материальная точка (его размеры много меньше длины нити); нить невесома и нерастяжима, поэтому сила натяжения направлена вдоль нити.<br>• Система отсчёта связана с Землёй — инерциальная, применим 2-й закон Ньютона. Сопротивлением воздуха пренебрегаем.<br>• Движение равномерное по окружности радиусом R = L sin α, поэтому ускорение центростремительное, a = ω²R, вертикальное ускорение равно нулю.<br><b>Решение.</b><br>По вертикали: T cos α = mg. К центру: T sin α = mω²R = mω²L sin α → T = mω²L.<br>Из этих уравнений ω²L cos α = g → ω² = g/(L cos α) = 10/(1·0,5) = 20 с⁻².<br>Период: T = 2π/ω = 2π/√20 ≈ 1,4 с."]]}];

const LAW=[
['mech','1-й закон Ньютона (закон инерции)','Существуют инерциальные системы отсчёта, в которых тело сохраняет состояние покоя или равномерного прямолинейного движения, если на него не действуют силы или их действие скомпенсировано.<br>Σ'+V('F')+' = 0 ⇒ '+V('a')+' = 0'],
['mech','2-й закон Ньютона','Ускорение тела прямо пропорционально равнодействующей силе, обратно пропорционально массе и направлено так же, как сила.<br>'+V('a')+' = '+fr('Σ'+V('F'),'m')],
['mech','3-й закон Ньютона','Тела действуют друг на друга с силами, равными по модулю и противоположными по направлению, лежащими на одной прямой. Силы одной природы и приложены к разным телам, поэтому не уравновешивают друг друга.<br>'+V('F')+'<sub>12</sub> = −'+V('F')+'<sub>21</sub>'],
['mech','Закон всемирного тяготения','Две материальные точки притягиваются с силой, прямо пропорциональной произведению их масс и обратно пропорциональной квадрату расстояния между ними.<br>F = G '+fr('m<sub>1</sub>m<sub>2</sub>','r<sup>2</sup>')+', G = 6,67·10<sup>−11</sup> Н·м²/кг²'],
['mech','Закон Гука','При малых упругих деформациях сила упругости прямо пропорциональна удлинению и направлена против деформации.<br>F<sub>упр</sub> = −kx (по модулю F = k|Δx|)'],
['mech','Сила трения скольжения','Сила трения скольжения пропорциональна силе нормальной реакции опоры и направлена против скольжения. В школьной модели не зависит от площади соприкосновения.<br>F<sub>тр</sub> = μN'],
['mech','Закон сохранения импульса','Импульс замкнутой системы тел сохраняется.<br>m<sub>1</sub>'+V('v')+'<sub>1</sub> + m<sub>2</sub>'+V('v')+'<sub>2</sub> = m<sub>1</sub>'+V('v')+'<sub>1</sub>′ + m<sub>2</sub>'+V('v')+'<sub>2</sub>′<br>При неупругом ударе: m<sub>1</sub>v<sub>1</sub> + m<sub>2</sub>v<sub>2</sub> = (m<sub>1</sub> + m<sub>2</sub>)u'],
['mech','Закон сохранения механической энергии','В замкнутой системе, где действуют только консервативные силы (тяжести, упругости), сумма кинетической и потенциальной энергий не меняется.<br>E<sub>к</sub> + E<sub>п</sub> = const'],
['mech','Теорема о кинетической энергии','Работа равнодействующей всех сил равна изменению кинетической энергии тела.<br>A = ΔE<sub>к</sub> = '+fr('mv<sup>2</sup>','2')+' − '+fr('mv<sub>0</sub><sup>2</sup>','2')],
['mech','Закон Паскаля','Давление, производимое на жидкость или газ, передаётся без изменения в каждую точку жидкости или газа по всем направлениям.'],
['mech','Закон Архимеда','На тело, погружённое в жидкость или газ, действует направленная вверх выталкивающая сила, равная весу вытесненной телом жидкости (газа).<br>F<sub>А</sub> = ρ<sub>ж</sub>gV<sub>погр</sub>'],
['mech','Условие плавания тел','Тело плавает, если сила Архимеда уравновешивает силу тяжести: F<sub>А</sub> = mg. Для однородного тела: ρ<sub>тела</sub> &lt; ρ<sub>ж</sub> плавает, ρ<sub>тела</sub> = ρ<sub>ж</sub> безразличное равновесие внутри, ρ<sub>тела</sub> &gt; ρ<sub>ж</sub> тонет.'],

 else{
  if(g===1){i=n===0?1:Math.max(1,Math.round(i*1.2));e=Math.max(1.3,e-.15)}
  else if(g===2){i=n===0?2:n===1?4:Math.max(i+1,Math.round(i*e))}
  else{i=n===0?5:Math.max(i+2,Math.round(Math.max(i,1)*e*1.3));e=e+.15}
  n++;d=Date.now()+i*DAY;
 }
 return {i,e,n,d};
}
const fcLab=r=>r.i===0?'10 мин':r.i===1?'1 день':r.i<5?r.i+' дня':r.i<30?r.i+' дн.':Math.round(r.i/30)+' мес.';
function fcBuild(extra){
 const now=Date.now(),due=[],nw=[],today=new Date().toDateString();
 if(!fcs.nd||fcs.nd.d!==today)fcs.nd={d:today,n:0,x:0};
 if(extra)fcs.nd.x+=extra;
 fcScope().forEach(c=>{const s=fcs.c[c.id];if(!s)nw.push(c.id);else if(s.d<=now)due.push(c.id)});
 due.sort((a,b)=>fcs.c[a].d-fcs.c[b].d);
 const room=Math.max(0,NEW_LIMIT+fcs.nd.x-fcs.nd.n);
 const q=[...due,...nw.slice(0,room)];
 fcSess={q,total:q.length,over:false};
 fcSave();
}
function fcOverPlan(){
 const sc=fcScope().filter(c=>fcs.c[c.id]).sort((a,b)=>fcs.c[a.id].i-fcs.c[b.id].i).slice(0,15).map(c=>c.id);
 fcSess={q:sc,total:sc.length,over:true};
}
function fcGrade(g){
 if(!fcSess||!fcSess.q.length)return;
 const id=fcSess.q[0],isNew=!fcs.c[id];
 if(isNew){fcs.nd.n++}
 fcs.c[id]=fcCalc(fcs.c[id],g);
 fcSess.q.shift();
 if(g===0)fcSess.q.push(id);
 fcFlip=false;fcSave();renderRev();
}
function fcStats(sc){
 const now=Date.now();let nw=0,lr=0,ms=0,du=0;
 sc.forEach(c=>{const s=fcs.c[c.id];if(!s)nw++;else{if(s.i>=21)ms++;else lr++;if(s.d<=now)du++}});
 return {nw,lr,ms,du,t:sc.length};
}
function fcWhen(sc){
 const now=Date.now();let m=Infinity;
 sc.forEach(c=>{const s=fcs.c[c.id];if(s&&s.d>now&&s.d<m)m=s.d});
 if(m===Infinity)return '';
 const h=(m-now)/36e5;return h<1?'меньше чем через час':h<24?'через '+Math.round(h)+' ч':'через '+Math.round(h/24)+' дн.';
}

/* ---- отрисовка ---- */
function fcFace(c,side){
 const rev=fcs.p.rev,fm=c.deck!=='l';
 const front=rev?{t:c.body,m:fm}:{t:c.name,m:false},back=rev?{t:c.name,m:false,n:c.note}:{t:c.body,m:fm,n:c.note};
 const f=side==='front'?front:back;
 return `<div class="fc-face ${side}"><div class="fc-cap">${c.tag}${side==='back'?' · ответ':''}</div><div class="fc-main ${f.m?'fc-math':''} ${!f.m&&f.t.length>140?'fc-long':''}">${f.t}</div>${f.n?`<div class="note" style="margin-top:12px">${f.n}</div>`:''}</div>`;
}
function fcCardHTML(c){
 return `<div class="fcx"><div class="fc ${fcFlip?'flipped':''}" id="fcCard" data-fflip tabindex="0" role="button" aria-label="Перевернуть карточку"><div class="fc-in">${fcFace(c,'front')}${fcFace(c,'back')}</div></div></div>`;
}
function fcOrd(){
 if(fcOrder)return fcOrder;
 let l=fcScope().filter(c=>!fcs.p.only||fcs.s[c.id]).map(c=>c.id);
 if(fcs.p.shuf)for(let i=l.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l[i],l[j]]=[l[j],l[i]]}
 return fcOrder=l;
}
function renderRev(){
 const p=fcs.p,sc=fcScope(),st=fcStats(sc),study=p.mode==='study';
 const chips=FCDECKS.map(d=>`<button class="chip ${d[0]===p.deck?'on':''}" data-fdeck="${d[0]}">${d[1]} · ${FC.filter(c=>c.deck===d[0]).length}</button>`).join('');
 const chs=[['all','Все']].concat(FCCH[p.deck]()).map(c=>`<button class="chip ${c[0]===p.ch?'on':''}" data-fch="${c[0]}">${c[1]} · ${c[0]==='all'?FC.filter(x=>x.deck===p.deck).length:FC.filter(x=>x.deck===p.deck&&x.ch===c[0]).length}</button>`).join('');
 const pc=n=>st.t?(n/st.t*100).toFixed(1):0;
 let h=`<div class="card"><h2>Повторение: карточки</h2>
 <p class="note">Как в Anki и Quizlet. Режим «Учить» сам решает, когда показать карточку снова: оцени, насколько хорошо вспомнил. Режим «Листать» нужен для спокойного просмотра. Прогресс хранится в браузере. Клавиши: пробел — перевернуть, 1–4 — оценка, стрелки и S — в режиме «Листать».</p>
 <div class="chips">${chips}</div><div class="chips" style="margin-top:8px">${chs}</div>
 <div class="seg"><button class="fcm ${study?'on':''}" data-fmode="study">Учить</button><button class="fcm ${!study?'on':''}" data-fmode="browse">Листать</button></div>
 <div class="fcbar"><button class="fcb ${p.rev?'on':''}" data-frev>⇄ Наоборот</button>${study?'':`<button class="fcb ${p.shuf?'on':''}" data-fshuf>Перемешать</button><button class="fcb ${p.only?'on':''}" data-fonly>★ Только отмеченные</button>`}</div>
 <div class="pbar" aria-hidden="true"><i style="width:${pc(st.ms)}%;background:var(--ok)"></i><i style="width:${pc(st.lr)}%;background:var(--sun)"></i></div>
 <p class="note" style="margin:6px 0 0">Новые ${st.nw} · Учу ${st.lr} · Выучено ${st.ms} · К повторению сейчас ${st.du}</p></div>`;
 if(!sc.length){h+='<div class="card"><p>В этом наборе нет карточек.</p></div>'}
 else if(study){
  if(!fcSess)fcBuild();
  const id=fcSess.q[0];
  if(!id){
   const nwLeft=sc.filter(c=>!fcs.c[c.id]).length,w=fcWhen(sc);
   h+=`<div class="card" style="text-align:center"><h2>${fcSess.over?'Круг закончен':'На сегодня всё'}</h2><p>${fcSess.total?'Пройдено карточек: '+fcSess.total+'.':'Карточек по расписанию сейчас нет.'}${w?' Следующее повторение '+w+'.':''}</p><div class="fcbar" style="justify-content:center">${nwLeft?`<button class="fcb" data-fmore>Ещё 10 новых</button>`:''}${sc.some(c=>fcs.c[c.id])?`<button class="fcb" data-fover>Повторить вне плана</button>`:''}<button class="fcb" data-freset>Сбросить прогресс набора</button></div></div>`;
  }else{
   const c=FCM[id],s=fcs.c[id];
   h+=`<p class="note" style="margin:12px 2px 0">Осталось: ${fcSess.q.length}${s?'':' · новая'}</p>`+fcCardHTML(c)+
   `<div class="fcbar" id="fcShow" style="justify-content:center"${fcFlip?' hidden':''}><button class="fcb big" data-fflip>Показать ответ</button></div>
   <div class="fcgr" id="fcGr"${fcFlip?'':' hidden'}>${['Снова','Трудно','Хорошо','Легко'].map((n,g)=>`<button class="gr g${g}" data-fgrade="${g}"><b>${n}</b><span>${fcLab(fcCalc(s,g))}</span></button>`).join('')}</div>`;
  }
 }else{
  const o=fcOrd();
  if(!o.length)h+=`<div class="card"><p>${p.only?'Отмеченных карточек в этом наборе пока нет. Отмечай звёздочкой нужные в режиме «Листать».':'В этом наборе нет карточек.'}</p></div>`;
  else{
   if(fcIdx>=o.length)fcIdx=0;
   const c=FCM[o[fcIdx]];
   h+=fcCardHTML(c)+`<div class="fcbar" style="justify-content:space-between;align-items:center"><button class="fcb" data-fprev aria-label="Предыдущая">←</button><span class="note">${fcIdx+1} / ${o.length}</span><button class="fcb" data-fnext aria-label="Следующая">→</button></div><div class="fcbar" style="justify-content:center"><button class="fcb ${fcs.s[c.id]?'on':''}" data-fstar>${fcs.s[c.id]?'★ Отмечена':'☆ Отметить'}</button></div>`;
  }
 }
 $('#rev').innerHTML=h;
}
function fcToggle(){
 if(fcs.p.mode==='study'&&(!fcSess||!fcSess.q.length))return;
 fcFlip=!fcFlip;
 const c=$('#fcCard');if(c)c.classList.toggle('flipped',fcFlip);
 if(fcs.p.mode==='study'){const a=$('#fcShow'),b=$('#fcGr');if(a)a.hidden=fcFlip;if(b)b.hidden=!fcFlip}
}
function fcMove(d){const o=fcOrd();if(!o.length)return;fcIdx=(fcIdx+d+o.length)%o.length;fcFlip=false;renderRev()}
function fcStar(){const o=fcOrd();if(!o.length)return;const id=o[fcIdx];if(fcs.s[id])delete fcs.s[id];else fcs.s[id]=1;fcSave();renderRev()}
function fcReset(){
 if(!confirm('Сбросить прогресс всех карточек в выбранном наборе?'))return;
 fcScope().forEach(c=>delete fcs.c[c.id]);fcSave();fcSess=null;fcFlip=false;renderRev();
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-fdeck],[data-fch],[data-fmode],[data-frev],[data-fshuf],[data-fonly],[data-fflip],[data-fgrade],[data-fprev],[data-fnext],[data-fstar],[data-fmore],[data-fover],[data-freset]');
 if(!t)return;const d=t.dataset,p=fcs.p;
 if('fflip' in d){fcToggle();return}
 if('fgrade' in d){fcGrade(+d.fgrade);return}
 if('fprev' in d){fcMove(-1);return}
 if('fnext' in d){fcMove(1);return}
 if('fstar' in d){fcStar();return}
 if('fmore' in d){fcBuild(10);renderRev();return}
 if('fover' in d){fcOverPlan();fcFlip=false;renderRev();return}
 if('freset' in d){fcReset();return}
 if('fdeck' in d){p.deck=d.fdeck;p.ch='all'}
 else if('fch' in d)p.ch=d.fch;
 else if('fmode' in d)p.mode=d.fmode;
 else if('frev' in d)p.rev=!p.rev;
 else if('fshuf' in d)p.shuf=!p.shuf;
 else if('fonly' in d)p.only=!p.only;
 fcSess=null;fcOrder=null;fcIdx=0;fcFlip=false;fcSave();renderRev();
});
document.addEventListener('keydown',e=>{
 const r=$('#rev');if(!r||r.hidden||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.target.closest&&e.target.closest('button,input,select,textarea,a,summary'))return;
 const k=e.key;
 if(k===' '||k==='Enter'){e.preventDefault();fcToggle()}
 else if(fcs.p.mode==='study'){if(['1','2','3','4'].includes(k)&&fcFlip)fcGrade(+k-1)}
 else{if(k==='ArrowRight')fcMove(1);else if(k==='ArrowLeft')fcMove(-1);else if('sSыЫ'.includes(k)&&k.length===1)fcStar()}
});

/* ---------- plan ---------- */
function fmt(d){return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}).replace('.','')}
function renderPlan(){
 const start=new Date(2026,9,20);
 let h=`<div class="card"><h2>План на 10 недель</h2><p class="note">Старт 20 октября 2026. Темп: 1,5–2 часа в день, 6 дней в неделю, один день отдыха. Если неделя не получилась, сдвигай план, но не пропускай задачи.</p>`;
 PLAN.forEach((w,i)=>{
  const a=new Date(start.getTime()+i*7*864e5),b=new Date(a.getTime()+6*864e5);
  const ok=wdone.includes(String(i));
  h+=`<div class="week ${ok?'isdone':''}"><label><input type="checkbox" data-week="${i}" ${ok?'checked':''}><span><span class="wk">Неделя ${i+1} · ${fmt(a)} – ${fmt(b)}</span><b>${w[0]}</b><span class="note">${w[1]}</span></span></label></div>`;
 });
 h+='</div>';
 h+=`<div class="card"><h2>Как заниматься каждый день</h2>
 <p><b>1. Видео и конспект (25–30 минут).</b> Смотри один урок по теме и записывай идеи, а не слова преподавателя.</p>
 <p><b>2. Теория здесь (15 минут).</b> Прочитай главу и выпиши формулы на лист. Для каждой формулы скажи, что значит каждая буква и когда она верна.</p>
 <p><b>3. Задачи (60 минут).</b> Минимум 10–15 задач на тему, из них 3–5 посложнее. Не смотри ответ сразу: сначала 10 минут своей попытки.</p>
 <p><b>4. Тетрадь ошибок.</b> Каждую неверную задачу записывай: условие, где ошибся, правильная идея. Через 1, 3 и 7 дней решай её заново.</p>
 <p><b>5. Конец недели.</b> 30 минут на воспроизведение формул по памяти и мини-контрольная из 10 задач. Вернулся к слабым местам, потом новая тема.</p>
 <p class="note">Где брать задачи: «Физика. Задачник 10–11» А. П. Рымкевича, учебник Мякишева, Буховцева и Сотского (в нём теория и задачи по порядку), задания 10 класса на <a href="https://phys-ege.sdamgia.ru" target="_blank" rel="noopener">Решу ЕГЭ</a> по темам.</p></div>
 <div class="card"><h2>Как проверять себя</h2>
 <p>Глава считается изученной, когда ты: 1) выводишь основные формулы сам; 2) решаешь типовую задачу на каждый пункт без подсказки; 3) объясняешь тему вслух за 3 минуты. Отмечай галочку в конце главы на вкладке «Теория и формулы».</p></div>`;
 $('#plan').innerHTML=h;
}
